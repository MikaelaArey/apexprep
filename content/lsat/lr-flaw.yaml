# LSAT Logical Reasoning: Flaw questions. Original items written for ApexPrep.
# The correct option is listed first; the build shuffles answer order.

- id: lsat-lr-0100
  type: flaw
  kps: [kp-lsat-flaw-equivocation]
  difficulty: 2
  stimulus: >-
    The museum describes its new exhibit as a "free" experience, meaning visitors
    may explore its rooms in any order they choose. Yet the museum charges
    admission to the exhibit. So the museum's description is false.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats a word used in one sense in the museum's description as if it were used in a different sense
      correct: true
      why: The museum meant "free to explore in any order"; the argument reads it as "no charge."
    - text: assumes that what is true of the exhibit is true of the museum as a whole
      trap: not_present
      why: The argument makes no claim about the museum as a whole.
    - text: relies on the testimony of museum staff who may have a motive to mislead
      trap: not_present
      why: No testimony is cited.
    - text: concludes that a claim is false merely because it has not been proven true
      trap: not_present
      why: The argument offers a reason (the admission charge), not a lack of proof.
    - text: fails to consider that admission prices may change in the future
      trap: out_of_scope
      why: Future prices don't bear on whether the description was false.
  tldr: '"Free" meant free to wander, not free of charge, so the charge doesn''t make the description false.'
  steps:
    - label: Spot the word
      body: The whole argument turns on "free."
    - label: Compare senses
      body: The museum's sense is about movement; the critic's sense is about price.
  takeaway: When an argument turns on a single word, check whether it keeps the same meaning throughout.

- id: lsat-lr-0101
  type: flaw
  kps: [kp-lsat-flaw-circular]
  difficulty: 2
  stimulus: >-
    Columnist: Greenfield's mayor is the most trustworthy official in the region.
    After all, she has never told the public anything false, and we can be confident
    of that because a trustworthy official like her would never mislead the public.
  prompt: The reasoning in the columnist's argument is flawed because it
  options:
    - text: presupposes the truth of its conclusion in offering support for one of its premises
      correct: true
      why: Her honesty is "shown" by assuming she's trustworthy, which is the conclusion itself.
    - text: attacks the character of the mayor's critics rather than their arguments
      trap: not_present
      why: No critics are mentioned.
    - text: draws a conclusion about all officials from the case of a single official
      trap: not_present
      why: The conclusion is about the mayor alone.
    - text: takes for granted that the mayor's popularity proves her trustworthiness
      trap: not_present
      why: Popularity never comes up.
    - text: confuses a necessary condition for trustworthiness with a sufficient one
      trap: not_present
      why: The problem is circularity, not a conditional reversal.
  tldr: It proves she's trustworthy by assuming she's trustworthy. That's circular.
  steps:
    - label: Trace support
      body: Conclusion ← she never lied ← a trustworthy official wouldn't lie.
    - label: Notice
      body: The last link assumes the conclusion, so nothing independent supports it.
  takeaway: If a premise only makes sense once you accept the conclusion, the argument is circular.

- id: lsat-lr-0102
  type: flaw
  kps: [kp-lsat-flaw-false-choice]
  difficulty: 1
  stimulus: >-
    Either the city raises property taxes or it closes two of its public libraries.
    Since raising property taxes would hurt the city's homeowners, the city should
    close the libraries.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: fails to consider that there may be options other than raising property taxes or closing libraries
      correct: true
      why: The city might cut other spending, find grants or raise other fees.
    - text: assumes that whatever hurts homeowners also hurts renters
      trap: out_of_scope
      why: Renters are never mentioned.
    - text: relies on an appeal to popular opinion
      trap: not_present
      why: No one's opinion is cited.
    - text: treats a claim about the city's budget as if it were a claim about its residents
      trap: not_present
      why: The argument doesn't blur those claims.
    - text: draws a general conclusion from a single example
      trap: not_present
      why: No example is used.
  tldr: It assumes those are the only two choices.
  steps:
    - label: Map
      body: Tax or close libraries; tax hurts homeowners; so close libraries.
    - label: Flaw
      body: The "either/or" premise ignores every other way to balance the budget.
  takeaway: '"Either X or Y" premises are suspect: ask whether there''s a third option.'

- id: lsat-lr-0103
  type: flaw
  kps: [kp-lsat-flaw-authority]
  difficulty: 1
  stimulus: >-
    Dr. Lim, a renowned cardiologist, says that the new tax on sugary drinks will
    have no effect on the local economy. So the tax will have no effect on the local
    economy.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: relies on the opinion of an expert on a matter outside her area of expertise
      correct: true
      why: A cardiologist's training doesn't make her an authority on economics.
    - text: attacks Dr. Lim's motives instead of evaluating her claim
      trap: wrong_direction
      why: The argument accepts her claim; it doesn't attack her.
    - text: assumes that a tax that affects health will also affect the economy
      trap: distortion
      why: The argument concludes there will be no economic effect.
    - text: treats a correlation as evidence of causation
      trap: not_present
      why: No correlation is cited.
    - text: confuses what will happen with what should happen
      trap: not_present
      why: Both claims are about what will happen.
  tldr: A heart specialist's view on economics isn't expert evidence.
  steps:
    - label: Source
      body: The only support is Dr. Lim's say-so.
    - label: Fit
      body: Her expertise (cardiology) doesn't cover the claim (economic effects).
  takeaway: Expert testimony counts only within the expert's field.

- id: lsat-lr-0104
  type: flaw
  kps: [kp-lsat-flaw-popularity]
  difficulty: 1
  stimulus: >-
    A recent poll found that 70 percent of residents believe the proposed highway
    will reduce traffic downtown. Since so many residents agree, the highway will
    reduce downtown traffic.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: treats the fact that many people believe a claim as sufficient evidence that it is true
      correct: true
      why: Widespread belief about traffic isn't evidence about traffic.
    - text: relies on a poll of residents who do not live downtown
      trap: unsupported
      why: The stimulus doesn't say where the respondents live.
    - text: assumes that reducing traffic is the highway's only purpose
      trap: not_present
      why: The argument doesn't discuss the highway's purposes.
    - text: confuses a cause with an effect
      trap: not_present
      why: No causal reversal occurs.
    - text: fails to consider that the highway's costs may outweigh its benefits
      trap: out_of_scope
      why: The conclusion is about traffic, not whether the highway is worth it.
  tldr: Seventy percent believing it doesn't make it true.
  steps:
    - label: Evidence
      body: The only support is what most residents believe.
    - label: Flaw
      body: Belief, however common, isn't evidence that the belief is correct.
  takeaway: Popularity is evidence of opinion, not of fact.

- id: lsat-lr-0105
  type: flaw
  kps: [kp-lsat-flaw-straw-man]
  difficulty: 2
  stimulus: >-
    Councilor Diaz has proposed lowering the speed limit on Elm Street from 35 to 25
    miles per hour. But banning cars from Elm Street entirely would devastate the
    businesses there. Diaz's proposal should therefore be rejected.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: argues against a position more extreme than the one actually proposed
      correct: true
      why: Diaz proposed a lower speed limit, not a ban on cars.
    - text: assumes that what benefits businesses also benefits residents
      trap: not_present
      why: Residents' interests never come up.
    - text: relies on a sample that is unrepresentative
      trap: not_present
      why: No sample is involved.
    - text: attacks Diaz's character rather than her proposal
      trap: not_present
      why: It attacks a (distorted) proposal, not Diaz herself.
    - text: concludes that a proposal will fail merely because it has not been tried
      trap: not_present
      why: Novelty isn't the stated reason.
  tldr: It refutes a car ban nobody proposed. That's a straw man.
  steps:
    - label: Proposal
      body: Lower the limit from 35 to 25.
    - label: Argument
      body: Rebuts a total ban, a much stronger position, then rejects the real proposal.
  takeaway: Check whether the view being attacked is the view actually held.

- id: lsat-lr-0106
  type: flaw
  kps: [kp-lsat-flaw-hasty]
  difficulty: 1
  stimulus: >-
    Last month I ate at two restaurants in Port Ellis, and both served undercooked
    fish. Clearly, the restaurants in Port Ellis do not follow food-safety standards.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: draws a broad conclusion about a group on the basis of too few cases
      correct: true
      why: Two meals can't show what all of the town's restaurants do.
    - text: presumes that what is true of a group is true of each of its members
      trap: reversal
      why: The argument runs from members to the group, not the reverse.
    - text: relies on a source with a stake in the outcome
      trap: not_present
      why: No interested source is involved.
    - text: mistakes a lack of evidence for evidence that something is false
      trap: not_present
      why: The argument cites positive evidence, just too little of it.
    - text: confuses a necessary condition with a sufficient one
      trap: not_present
      why: No conditional reasoning appears.
  tldr: Two restaurants can't speak for every restaurant in town.
  steps:
    - label: Evidence
      body: Two bad meals at two restaurants.
    - label: Conclusion
      body: A claim about all the town's restaurants, which is far broader than the evidence.
  takeaway: Watch the gap between how many cases are cited and how broad the conclusion is.

- id: lsat-lr-0107
  type: flaw
  kps: [kp-lsat-flaw-absence]
  difficulty: 1
  stimulus: >-
    No study has ever shown that the herbal supplement Calmera improves sleep.
    Therefore, Calmera does not improve sleep.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: takes the lack of evidence for a claim as proof that the claim is false
      correct: true
      why: No study showing an effect isn't the same as studies showing no effect.
    - text: relies on studies funded by the supplement's manufacturer
      trap: not_present
      why: No studies are cited at all.
    - text: generalizes from a small number of studies
      trap: not_present
      why: The point is that there are no supporting studies.
    - text: assumes that what helps some people sleep helps everyone sleep
      trap: not_present
      why: The argument makes no claim about who is helped.
    - text: confuses improving sleep with curing insomnia
      trap: not_present
      why: Insomnia isn't mentioned.
  tldr: '"Not shown to work" doesn''t mean "shown not to work."'
  steps:
    - label: Premise
      body: No evidence that it works.
    - label: Conclusion
      body: It doesn't work, which needs evidence against it, not just missing evidence for it.
  takeaway: Absence of proof is not proof of absence.

- id: lsat-lr-0108
  type: flaw
  kps: [kp-lsat-flaw-possible-certain]
  difficulty: 2
  stimulus: >-
    The proposed factory could release pollutants into the Redwater River. Pollution
    in the river would harm the fish that local anglers depend on. So if the factory
    is built, the anglers' catch will decline.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats something that could happen as if it will happen
      correct: true
      why: The factory "could" pollute, but the conclusion says the catch "will" decline.
    - text: relies on the testimony of anglers who oppose the factory
      trap: not_present
      why: No anglers are quoted.
    - text: concludes that a factory is harmful merely because it is new
      trap: not_present
      why: The argument gives a reason beyond newness.
    - text: fails to weigh the factory's economic benefits
      trap: out_of_scope
      why: The conclusion is about the catch, not overall worth.
    - text: confuses a cause of pollution with an effect of pollution
      trap: not_present
      why: The causal chain runs in a sensible direction.
  tldr: '"Could pollute" becomes "will reduce the catch." A possibility is treated as certain.'
  steps:
    - label: Find the hedge
      body: '"Could release pollutants."'
    - label: Find the jump
      body: '"Will decline" assumes the pollution actually happens.'
  takeaway: Watch for "may" or "could" in the premises and "will" in the conclusion.

- id: lsat-lr-0109
  type: flaw
  kps: [kp-lsat-flaw-post-hoc]
  difficulty: 1
  stimulus: >-
    Shortly after the town of Millbrook painted its fire hydrants bright yellow, the
    number of house fires in Millbrook declined. Evidently, the yellow paint helped
    prevent house fires.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: infers that one event caused another merely because the second followed the first
      correct: true
      why: Fires declining after the painting doesn't show the painting caused the decline.
    - text: assumes that yellow is the only color that would have helped
      trap: not_present
      why: The argument never compares colors.
    - text: confuses the number of fires with the damage they cause
      trap: not_present
      why: Damage isn't discussed.
    - text: attacks the motives of those who opposed painting the hydrants
      trap: not_present
      why: No opponents appear.
    - text: presumes that hydrants are used to fight every house fire
      trap: not_present
      why: That presumption isn't needed for the argument as stated.
  tldr: Before-and-after timing alone doesn't show the paint did anything.
  steps:
    - label: Evidence
      body: Paint, then fewer fires.
    - label: Flaw
      body: Sequence isn't cause. Weather, inspections or chance could explain the drop.
  takeaway: '"After this, therefore because of this" is a flaw. Look for a rival explanation.'

- id: lsat-lr-0110
  type: flaw
  kps: [kp-lsat-flaw-alternatives]
  difficulty: 2
  stimulus: >-
    To cut its carbon emissions by 20 percent, the Halcyon Corporation must stop
    operating its oldest factory, since that factory produces 20 percent of the
    company's emissions.
  prompt: Which one of the following most accurately describes a flaw in the argument?
  options:
    - text: It overlooks the possibility that the company could cut emissions by the same amount in other ways.
      correct: true
      why: Closing that factory is one way to hit 20 percent, not the only one.
    - text: It assumes that the oldest factory is also the least profitable.
      trap: not_present
      why: Profit never comes up.
    - text: It treats a reduction in emissions as a reduction in every kind of pollution.
      trap: not_present
      why: Only emissions are discussed.
    - text: It relies on emissions figures supplied by the company itself.
      trap: not_present
      why: The source of the figures isn't mentioned.
    - text: It concludes that the company will close the factory merely because it should.
      trap: distortion
      why: The argument says the company must close it, not that it will.
  tldr: Closing that factory is one way to cut 20 percent, not the only way.
  steps:
    - label: Claim
      body: '"Must" close the factory to reach the goal.'
    - label: Gap
      body: Efficiency upgrades or cuts elsewhere could reach the same 20 percent.
  takeaway: '"Must" claims about reaching a goal often ignore other routes to it.'

- id: lsat-lr-0111
  type: flaw
  kps: [kp-lsat-necessary-vs-sufficient]
  difficulty: 1
  stimulus: >-
    To be admitted to the Bellmont Conservatory, an applicant must pass a rigorous
    audition. Theo passed the audition, so he will be admitted to the conservatory.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats a requirement for admission as if it guaranteed admission
      correct: true
      why: Passing is necessary, but other requirements could still keep Theo out.
    - text: assumes that every applicant who fails the audition will reapply
      trap: not_present
      why: Reapplying isn't discussed.
    - text: relies on Theo's own report that he passed
      trap: not_present
      why: The stimulus states that he passed.
    - text: draws a conclusion about all applicants from one applicant's case
      trap: not_present
      why: The conclusion is about Theo only.
    - text: presumes that the audition is the conservatory's only requirement for graduation
      trap: distortion
      why: Graduation isn't the issue; the argument is about admission.
  tldr: '"Must pass to get in" doesn''t mean "passing gets you in."'
  steps:
    - label: Map
      body: "Admitted → passed audition. Theo passed, so the argument concludes Theo is admitted."
    - label: Flaw
      body: That reverses the conditional, treating a requirement as a guarantee.
  takeaway: '"Must" introduces a necessary condition. Meeting it isn''t enough.'

- id: lsat-lr-0112
  type: flaw
  kps: [kp-lsat-part-whole]
  difficulty: 2
  stimulus: >-
    The Westfield Symphony won this year's statewide orchestra competition. So each
    of its musicians must be among the best musicians in the state.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: assumes that a property of a whole group must belong to each of its members
      correct: true
      why: An orchestra can win as an ensemble even if some individual players aren't top-tier.
    - text: assumes that a property of each member must belong to the whole group
      trap: reversal
      why: That's the opposite direction. This argument runs from the group to each member.
    - text: treats a competition result as if it were a matter of opinion
      trap: not_present
      why: The argument takes the result as fact.
    - text: confuses the orchestra's past success with its future success
      trap: not_present
      why: No prediction is made.
    - text: generalizes from a single performance to the orchestra's entire history
      trap: not_present
      why: The conclusion is about the musicians, not the orchestra's history.
  tldr: The best orchestra needn't consist entirely of the best musicians.
  steps:
    - label: Direction
      body: Whole (the orchestra won) to parts (each musician is the best).
    - label: Flaw
      body: That's division. Group success can come from teamwork or a few stars.
  takeaway: What's true of a group isn't automatically true of each member.

- id: lsat-lr-0113
  type: flaw
  kps: [kp-lsat-numbers-proportions]
  difficulty: 2
  stimulus: >-
    This year, 40 percent of the cars sold at Avalon Motors were electric, up from 25
    percent last year. So Avalon Motors sold more electric cars this year than last
    year.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: overlooks the possibility that Avalon sold far fewer cars in total this year
      correct: true
      why: 40 percent of a small total can be fewer cars than 25 percent of a large one.
    - text: assumes that electric cars are more profitable than other cars
      trap: not_present
      why: Profit isn't mentioned.
    - text: relies on sales figures from only two years
      trap: not_present
      why: Comparing two years is fine. The issue is shares versus counts.
    - text: confuses the popularity of electric cars with their quality
      trap: not_present
      why: Quality isn't discussed.
    - text: presumes that the customers who bought electric cars were satisfied
      trap: not_present
      why: Satisfaction isn't part of the argument.
  tldr: A bigger share of fewer total sales can mean fewer electric cars.
  steps:
    - label: Evidence
      body: Electric cars' share rose from 25% to 40%.
    - label: Gap
      body: The conclusion is about a count, which depends on total sales too.
  takeaway: Percentages alone can't establish amounts. Ask what happened to the total.

- id: lsat-lr-0114
  type: flaw
  kps: [kp-lsat-sampling]
  difficulty: 2
  stimulus: >-
    To find out whether residents of Clearwater support building a new public pool,
    the city surveyed people leaving its existing community swim center. Ninety
    percent supported the new pool. Clearly, most Clearwater residents support it.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: draws a conclusion about all residents from a group likely to be more favorable than residents in general
      correct: true
      why: People at a swim center are likelier than average to want a pool.
    - text: assumes that residents who support the pool would use it
      trap: not_present
      why: Use isn't part of the conclusion.
    - text: fails to consider the cost of building the pool
      trap: out_of_scope
      why: The conclusion is about support, not cost.
    - text: treats a claim about the pool's popularity as a claim about its value
      trap: not_present
      why: The conclusion is only about support.
    - text: relies on a survey too small to be reliable
      trap: unsupported
      why: The survey's size isn't given; the problem is who was asked.
  tldr: Swimmers aren't a fair sample of residents on a pool question.
  steps:
    - label: Sample
      body: People leaving a swim center.
    - label: Flaw
      body: They differ from residents in exactly the way that affects the answer.
  takeaway: A biased sample can't support a conclusion about the whole population.

- id: lsat-lr-0115
  type: flaw
  kps: [kp-lsat-source-attack]
  difficulty: 1
  stimulus: >-
    Professor Okafor's study concludes that the city's new bus routes have shortened
    commute times. But Professor Okafor rides the bus to work every day, so her
    conclusion cannot be trusted.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: dismisses a conclusion because of a fact about the person who reached it rather than the evidence for it
      correct: true
      why: Riding the bus doesn't show her study's evidence is bad.
    - text: assumes that commute time is the only measure of a bus system's success
      trap: not_present
      why: The argument doesn't discuss measures of success.
    - text: relies on a single study
      trap: not_present
      why: The argument rejects the study rather than relying on it.
    - text: confuses a correlation with a cause
      trap: not_present
      why: No correlation is cited.
    - text: presumes that people who ride the bus prefer shorter commutes
      trap: not_present
      why: Preferences aren't part of the argument.
  tldr: It attacks the researcher, not her research.
  steps:
    - label: Map
      body: "Conclusion: distrust the study. Reason: the author rides the bus."
    - label: Flaw
      body: A personal connection can suggest checking the work, but it doesn't refute it.
  takeaway: Rejecting a claim because of who made it is an ad hominem flaw.

- id: lsat-lr-0116
  type: flaw
  kps: [kp-lsat-rival-cause]
  difficulty: 2
  stimulus: >-
    Children who eat breakfast every day earn higher grades than children who skip
    breakfast. So eating breakfast every day improves children's grades.
  prompt: The reasoning in the argument is most vulnerable to criticism on the grounds that it
  options:
    - text: overlooks the possibility that some other factor, such as a structured home routine, leads both to daily breakfasts and to higher grades
      correct: true
      why: A third factor could explain both, so the correlation doesn't show breakfast causes better grades.
    - text: presumes that what is true of children is true of adults
      trap: not_present
      why: Adults aren't mentioned.
    - text: relies on grades as the only measure of learning
      trap: not_present
      why: The conclusion is about grades specifically.
    - text: assumes that all breakfasts are equally nutritious
      trap: not_present
      why: The argument doesn't need that assumption.
    - text: treats a claim about most children as a claim about every child
      trap: not_present
      why: The comparison is between groups; no "every child" claim is made.
  tldr: A shared cause, like a stable home routine, could produce both breakfasts and grades.
  steps:
    - label: Evidence
      body: Breakfast eaters get better grades.
    - label: Gap
      body: Correlation treated as cause. A common factor could produce both.
  takeaway: Before accepting "X causes Y," look for a third factor that causes both.

- id: lsat-lr-0117
  type: flaw
  kps: [kp-lsat-reverse-causation]
  difficulty: 2
  stimulus: >-
    People who own dogs report being happier than people who do not. So owning a dog
    makes people happier.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: ignores the possibility that happier people are more likely to choose to own dogs
      correct: true
      why: The causation could run the other way.
    - text: assumes that dog owners own only one dog
      trap: not_present
      why: The number of dogs doesn't matter here.
    - text: relies on self-reports that are known to be false
      trap: too_strong
      why: Nothing says the reports are false.
    - text: generalizes from dogs to all pets
      trap: not_present
      why: The conclusion is only about dogs.
    - text: confuses owning a dog with caring for a dog
      trap: not_present
      why: That distinction plays no role.
  tldr: Maybe happiness leads to dog ownership, not the other way around.
  steps:
    - label: Claim
      body: Dogs → happiness.
    - label: Alternative
      body: Happiness → choosing a dog explains the same correlation.
  takeaway: For any "X causes Y" from a correlation, consider whether Y causes X.

- id: lsat-lr-0118
  type: flaw
  kps: [kp-lsat-flaw-equivocation]
  difficulty: 2
  stimulus: >-
    Critic: The science museum describes natural selection as a theory. But a theory
    is just a guess. So the museum admits that natural selection is only a guess.
  prompt: The critic's reasoning is flawed because it
  options:
    - text: relies on a shift between a scientific and an everyday meaning of a key word
      correct: true
      why: A scientific theory is a well-tested explanation; the everyday "theory" is a hunch.
    - text: rejects a claim because of who made it
      trap: not_present
      why: The museum's credibility isn't attacked.
    - text: treats the museum's description as the only evidence for natural selection
      trap: not_present
      why: The argument says nothing about other evidence.
    - text: assumes that scientific claims can never be revised
      trap: not_present
      why: Revision isn't discussed.
    - text: generalizes from one museum to all museums
      trap: not_present
      why: The conclusion is about this museum's description.
  tldr: '"Theory" means a tested explanation in science, not a guess.'
  steps:
    - label: Key word
      body: '"Theory."'
    - label: Two senses
      body: The museum uses the scientific sense; the critic substitutes the everyday sense.
  takeaway: Equivocation hides in words with both technical and everyday meanings.

- id: lsat-lr-0119
  type: flaw
  kps: [kp-lsat-flaw-circular]
  difficulty: 2
  stimulus: >-
    The Riverside Review publishes only the finest poetry, because every poem it
    prints meets the highest standards. And we know the poems meet those standards
    because they appear in the Riverside Review.
  prompt: The argument's reasoning is flawed because it
  options:
    - text: uses its conclusion as support for one of the claims offered in support of that conclusion
      correct: true
      why: Appearing in the Review is used to prove quality, which is used to prove the Review's standards.
    - text: assumes that popular poems are of high quality
      trap: not_present
      why: Popularity isn't mentioned.
    - text: overlooks the possibility that other journals also publish fine poetry
      trap: out_of_scope
      why: The claim is about what the Review publishes, not about other journals.
    - text: relies on the opinion of the journal's own editors
      trap: not_present
      why: No editor is quoted.
    - text: confuses the quantity of poems with their quality
      trap: not_present
      why: Quantity isn't discussed.
  tldr: Good because it's in the Review; in the Review because it's good. That's a circle.
  steps:
    - label: Trace
      body: Finest poetry ← meets standards ← appears in the Review.
    - label: Notice
      body: Appearing in the Review is exactly what's in question.
  takeaway: Circular arguments return to their starting point without outside support.

- id: lsat-lr-0120
  type: flaw
  kps: [kp-lsat-flaw-false-choice]
  difficulty: 1
  stimulus: >-
    Ana: Either you support the new stadium or you don't care about our city's
    economy. You've said you oppose the stadium, so clearly you don't care about the
    economy.
  prompt: The reasoning in Ana's argument is flawed because it
  options:
    - text: presents two alternatives as the only possibilities when others exist
      correct: true
      why: Someone can care about the economy and still oppose this stadium.
    - text: relies on an authority on economics
      trap: not_present
      why: No authority is cited.
    - text: assumes that the stadium will be built
      trap: not_present
      why: The argument doesn't predict whether it will be built.
    - text: confuses the stadium's cost with its benefits
      trap: not_present
      why: Costs and benefits aren't discussed.
    - text: generalizes from one city to all cities
      trap: not_present
      why: Only one city is involved.
  tldr: Opposing the stadium and caring about the economy are compatible.
  steps:
    - label: Premise
      body: Support it, or you don't care about the economy.
    - label: Flaw
      body: That ignores people who care about the economy but think the stadium is a bad deal.
  takeaway: Test "either/or" claims by looking for someone who fits neither box.

- id: lsat-lr-0121
  type: flaw
  kps: [kp-lsat-flaw-authority]
  difficulty: 1
  stimulus: >-
    The famous actor Jonah Price uses Brightsmile toothpaste and says it is the best
    on the market. So Brightsmile must be the best toothpaste available.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: treats the endorsement of someone with no relevant expertise as proof of a claim
      correct: true
      why: Being a famous actor doesn't make Price an expert on toothpaste.
    - text: attacks the motives of a competing toothpaste maker
      trap: not_present
      why: No competitor is mentioned.
    - text: assumes that the best toothpaste is also the most popular
      trap: not_present
      why: Popularity isn't the argument's evidence.
    - text: draws a conclusion about all toothpastes from one brand
      trap: not_present
      why: The conclusion is about Brightsmile.
    - text: confuses a product's price with its quality
      trap: not_present
      why: Price isn't mentioned.
  tldr: A celebrity endorsement isn't expert evidence.
  steps:
    - label: Evidence
      body: An actor's personal preference.
    - label: Flaw
      body: He has no expertise that would make his opinion strong evidence.
  takeaway: Endorsements from non-experts are testimony, not proof.

- id: lsat-lr-0122
  type: flaw
  kps: [kp-lsat-flaw-hasty]
  difficulty: 1
  stimulus: >-
    My grandfather smoked a pack of cigarettes a day and lived to be ninety-five. So
    smoking cannot be as harmful to health as doctors claim.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: relies on a single case to reject a claim about general tendencies
      correct: true
      why: Doctors' claim is about risk across many people; one long-lived smoker doesn't refute it.
    - text: presumes that doctors have a financial motive to exaggerate
      trap: not_present
      why: No motive is suggested.
    - text: appeals to the authority of doctors
      trap: wrong_direction
      why: The argument rejects the doctors' claim.
    - text: treats a possible harm as if it were a certain harm
      trap: wrong_direction
      why: The argument does the reverse, discounting a likely harm.
    - text: generalizes from all smokers to a single smoker
      trap: reversal
      why: >-
        It runs the other way: one case is used against a general claim.
  tldr: One exception doesn't disprove a general health risk.
  steps:
    - label: Evidence
      body: One smoker who lived long.
    - label: Flaw
      body: General claims about risk survive individual exceptions.
  takeaway: Anecdotes can't overturn claims about general tendencies.

- id: lsat-lr-0123
  type: flaw
  kps: [kp-lsat-flaw-absence]
  difficulty: 1
  stimulus: >-
    No one has ever shown that the old Harlow mansion is not haunted. So the mansion
    must be haunted.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats the failure to disprove a claim as proof that the claim is true
      correct: true
      why: That nobody has disproved it isn't evidence that it's true.
    - text: relies on the testimony of people who say they have seen ghosts
      trap: not_present
      why: No testimony is cited.
    - text: assumes that what is true of one mansion is true of all old buildings
      trap: not_present
      why: The conclusion concerns only this mansion.
    - text: confuses a cause with its effect
      trap: not_present
      why: No causal claim is made.
    - text: attacks the credibility of skeptics
      trap: not_present
      why: No skeptics are mentioned.
  tldr: '"Not disproved" isn''t "proved."'
  steps:
    - label: Premise
      body: No evidence against the claim.
    - label: Flaw
      body: The conclusion needs evidence for it.
  takeaway: Lack of disproof, like lack of proof, settles nothing by itself.

- id: lsat-lr-0124
  type: flaw
  kps: [kp-lsat-flaw-possible-certain]
  difficulty: 2
  stimulus: >-
    Most first-time novelists do not earn back their publisher's advance. Dana is a
    first-time novelist. So Dana will not earn back her advance.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: treats what is true of most members of a group as certain to be true of a particular member
      correct: true
      why: '"Most" leaves room for Dana to be one of the exceptions.'
    - text: generalizes from a single novelist to all novelists
      trap: reversal
      why: It runs the other way, applying a group statistic to one person.
    - text: relies on statistics about advances that may be out of date
      trap: unsupported
      why: Nothing suggests the figures are outdated.
    - text: confuses earning back an advance with writing a good novel
      trap: not_present
      why: Quality isn't discussed.
    - text: assumes that Dana's publisher is typical of all publishers
      trap: too_weak
      why: Even if her publisher is typical, "most" still doesn't guarantee Dana's result.
  tldr: '"Most" makes Dana''s outcome likely, not certain.'
  steps:
    - label: Premise
      body: Most first-time novelists fall short.
    - label: Flaw
      body: The conclusion says Dana definitely will, which needs "all."
  takeaway: Statistical premises support probable conclusions, not certain ones.

- id: lsat-lr-0125
  type: flaw
  kps: [kp-lsat-part-whole]
  difficulty: 2
  stimulus: >-
    Each player on the Rockport team is among the most skilled players in the
    league. Therefore, the Rockport team will surely be one of the best teams in the
    league this season.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: presumes that because each member of a group has a characteristic, the group as a whole must have it
      correct: true
      why: Skilled individuals can still make a poor team if they don't play well together.
    - text: presumes that because a group has a characteristic, each member of the group must have it
      trap: reversal
      why: That is the reverse direction. This argument runs from members to the group.
    - text: relies on the opinion of the team's coach
      trap: not_present
      why: No one's opinion is cited.
    - text: assumes that skill can be measured objectively
      trap: not_present
      why: The argument takes the players' skill as given; measurement isn't the issue.
    - text: draws a conclusion about the whole league from one team
      trap: not_present
      why: The conclusion is about one team.
  tldr: Great players don't guarantee a great team. That's the part-to-whole flaw.
  steps:
    - label: Direction
      body: From each player (parts) to the team (whole).
    - label: Gap
      body: A team's quality depends on how players combine, not just on each player alone.
  takeaway: What's true of each part needn't be true of the whole (composition).

- id: lsat-lr-0126
  type: flaw
  kps: [kp-lsat-sampling]
  difficulty: 2
  stimulus: >-
    A magazine invited readers to mail in a survey about job satisfaction. Of the
    3,000 readers who responded, 80 percent said they were unhappy at work. Clearly,
    most of the magazine's readers are dissatisfied with their jobs.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: fails to consider that readers who were unhappy at work may have been more likely than others to respond
      correct: true
      why: A self-selected sample can overrepresent people with strong feelings about the topic.
    - text: relies on a sample too small to draw any conclusion
      trap: too_weak
      why: Three thousand responses is a lot; the problem is who chose to respond.
    - text: assumes that job satisfaction can't change over time
      trap: not_present
      why: The argument makes no claim about change.
    - text: confuses dissatisfaction with a job with dissatisfaction with a career
      trap: not_present
      why: That distinction plays no role in the argument.
    - text: presumes that the magazine's editors designed the survey fairly
      trap: out_of_scope
      why: The survey's wording isn't the issue; the sample's selection is.
  tldr: Volunteers who chose to answer may be the unhappiest readers.
  steps:
    - label: Sample
      body: Readers who chose to mail back a survey.
    - label: Flaw
      body: People with grievances are often more motivated to respond, so the sample is biased.
  takeaway: Self-selected samples are suspect even when they are large.

- id: lsat-lr-0127
  type: flaw
  kps: [kp-lsat-source-attack]
  difficulty: 1
  stimulus: >-
    Senator Hale argues that the city should ban plastic shopping bags. But Senator
    Hale herself was photographed carrying groceries in plastic bags last month. So
    her argument should be rejected.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: rejects an argument because the person making it has acted inconsistently with it
      correct: true
      why: Whether the ban is a good idea doesn't depend on the senator's own shopping habits.
    - text: assumes that a ban on plastic bags would be easy to enforce
      trap: not_present
      why: Enforcement is never discussed.
    - text: relies on a photograph whose authenticity is doubtful
      trap: unsupported
      why: Nothing suggests the photo is fake, and its authenticity wouldn't matter anyway.
    - text: treats a single month as typical of the senator's behavior
      trap: too_narrow
      why: Even years of plastic-bag use wouldn't refute her argument.
    - text: confuses what is legal with what is moral
      trap: not_present
      why: The argument doesn't discuss legality or morality.
  tldr: The senator's hypocrisy, if it is that, doesn't make her argument wrong.
  steps:
    - label: Evidence
      body: She uses plastic bags herself.
    - label: Flaw
      body: That attacks the arguer, not the reasons for the ban.
  takeaway: An argument can be sound even if its author doesn't live by it.

- id: lsat-lr-0128
  type: flaw
  kps: [kp-lsat-flaw-equivocation]
  difficulty: 3
  stimulus: >-
    The study found a statistically significant difference between the two groups'
    reading scores. A significant difference is an important difference. So the
    study found that the difference between the groups' reading scores is important.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: shifts between a technical and an everyday meaning of a key term
      correct: true
      why: Statistically significant means unlikely to be due to chance; it doesn't mean large or important.
    - text: assumes that the study's sample was representative
      trap: true_irrelevant
      why: Even a perfect sample wouldn't fix the shift in meaning.
    - text: draws a conclusion about individuals from data about groups
      trap: not_present
      why: The conclusion is about the groups' scores.
    - text: relies on a study that may have been poorly designed
      trap: unsupported
      why: The argument's problem lies in how it reads the finding, not in the study.
    - text: confuses a cause of the difference with an effect of it
      trap: not_present
      why: No causal claim is made.
  tldr: '"Significant" in statistics means unlikely to be chance, not important.'
  steps:
    - label: Key word
      body: '"Significant."'
    - label: Two senses
      body: The study uses the statistical sense; the conclusion uses the everyday sense.
  takeaway: Technical terms with everyday cousins are classic equivocation traps.

- id: lsat-lr-0129
  type: flaw
  kps: [kp-lsat-numbers-proportions]
  difficulty: 2
  stimulus: >-
    Reported bicycle thefts rose by 50 percent last year in Danbury but by only 10
    percent in Easton. So bicycle theft is now a bigger problem in Danbury than in
    Easton.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: overlooks the possibility that Easton has far more bicycle thefts than Danbury despite its smaller increase
      correct: true
      why: Danbury could have gone from 4 thefts to 6 while Easton went from 1,000 to 1,100.
    - text: assumes that all bicycle thefts are reported
      trap: true_irrelevant
      why: Underreporting doesn't address the gap between growth rates and totals.
    - text: presumes that bicycle theft will keep rising in both towns
      trap: not_present
      why: The argument makes no prediction.
    - text: fails to consider other kinds of theft
      trap: out_of_scope
      why: The conclusion is only about bicycle theft.
    - text: relies on figures from only one year
      trap: too_weak
      why: More years wouldn't fix confusing a rate of increase with an amount.
  tldr: A bigger percentage increase can start from a much smaller base.
  steps:
    - label: Evidence
      body: Growth rates, 50% vs 10%.
    - label: Conclusion
      body: Which town's problem is bigger now, which depends on actual numbers.
  takeaway: Percent changes say nothing about size without the starting amounts.

- id: lsat-lr-0130
  type: flaw
  kps: [kp-lsat-analogy]
  difficulty: 2
  stimulus: >-
    A ship needs a single captain whose orders are obeyed without debate. A nation
    is like a ship. So a nation should be ruled by a single leader whose orders are
    obeyed without debate.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: relies on an analogy without showing that the two things are alike in the respects that matter
      correct: true
      why: Ships face emergencies needing instant obedience; nations differ in size, purpose and timescale.
    - text: assumes that what is true of one ship is true of all ships
      trap: not_present
      why: The argument's weakness is the ship–nation comparison, not ship generalizations.
    - text: confuses a necessary condition for a sufficient one
      trap: not_present
      why: No conditional reasoning is reversed.
    - text: attacks those who favor debate rather than their arguments
      trap: not_present
      why: No opponents are mentioned.
    - text: concludes that something is true merely because it has not been disproved
      trap: not_present
      why: The argument offers an analogy as positive support.
  tldr: Calling a nation "like a ship" doesn't show they're alike in the ways that matter.
  steps:
    - label: Structure
      body: Ships need X; nations are like ships; so nations need X.
    - label: Test the analogy
      body: Do the features that justify a captain's authority carry over to a nation? The argument never shows that.
  takeaway: An analogy is only as strong as the relevant similarity between its two cases.

- id: lsat-lr-0131
  type: flaw
  kps: [kp-lsat-necessary-vs-sufficient]
  difficulty: 2
  stimulus: >-
    The orchid will flower only if it gets at least six hours of sunlight a day.
    Since it is now getting eight hours of sunlight a day, it will flower.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: takes a condition required for flowering to be enough to make the orchid flower
      correct: true
      why: '"Only if" marks a necessary condition. The orchid might also need water, warmth or maturity.'
    - text: assumes that more sunlight is always better for the orchid
      trap: not_present
      why: The argument never claims eight hours beats six.
    - text: relies on a measurement of sunlight that may be inaccurate
      trap: unsupported
      why: Nothing suggests the measurement is wrong.
    - text: overlooks the possibility that the orchid flowered in the past with less sunlight
      trap: contradicts
      why: The premise says it can't flower with less than six hours.
    - text: concludes that one event caused another because they occurred together
      trap: not_present
      why: No correlation is offered as evidence.
  tldr: '"Only if" gives a requirement, not a guarantee.'
  steps:
    - label: Map
      body: "Flowers → 6+ hours of sun. Has 8 hours, so the argument concludes it will flower."
    - label: Flaw
      body: That reverses the conditional.
  takeaway: '"X only if Y" means X → Y. Having Y doesn''t give you X.'

- id: lsat-lr-0132
  type: flaw
  kps: [kp-lsat-necessary-vs-sufficient]
  difficulty: 2
  stimulus: >-
    Any candidate who wins the teachers' union's endorsement will win the election.
    Morales did not win the union's endorsement. So Morales will not win the
    election.
  prompt: The argument's reasoning is flawed because it
  options:
    - text: overlooks the possibility that a candidate could win the election without the union's endorsement
      correct: true
      why: The endorsement guarantees a win, but nothing says it's the only path to one.
    - text: assumes that the union's endorsement is based on candidates' qualifications
      trap: not_present
      why: The basis of the endorsement plays no role.
    - text: takes for granted that Morales sought the union's endorsement
      trap: true_irrelevant
      why: Whether she sought it doesn't affect the logical gap.
    - text: presumes that the union's members all vote alike
      trap: not_present
      why: The premise states the endorsement's effect directly.
    - text: treats the election's outcome as already decided
      trap: distortion
      why: The real problem is the negated conditional, not certainty as such.
  tldr: Endorsement is enough to win, not required to win.
  steps:
    - label: Map
      body: "Endorsed → wins. Not endorsed, so the argument concludes not wins."
    - label: Flaw
      body: Negating both sides doesn't preserve a conditional.
  takeaway: From "if X then Y" and "not X," nothing follows about Y.

- id: lsat-lr-0133
  type: flaw
  kps: [kp-lsat-reverse-causation]
  difficulty: 2
  stimulus: >-
    Cities with more police officers per resident tend to have higher crime rates.
    So hiring more police officers tends to increase crime.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: ignores the possibility that high crime rates lead cities to hire more police officers
      correct: true
      why: The correlation fits causation running the other way.
    - text: assumes that crime rates are reported accurately
      trap: true_irrelevant
      why: Accurate reporting wouldn't fix the causal reversal.
    - text: generalizes from a small number of cities
      trap: unsupported
      why: The number of cities isn't given, and it isn't the main problem.
    - text: confuses violent crime with crime in general
      trap: not_present
      why: No distinction between kinds of crime is drawn.
    - text: relies on the testimony of police officials
      trap: not_present
      why: No testimony is cited.
  tldr: Crime may drive police hiring, rather than police driving crime.
  steps:
    - label: Claim
      body: More police → more crime.
    - label: Alternative
      body: More crime → more police explains the same pattern.
  takeaway: When a correlation is offered as cause, always test the reverse direction.

- id: lsat-lr-0134
  type: flaw
  kps: [kp-lsat-flaw-circular]
  difficulty: 2
  stimulus: >-
    We can trust this encyclopedia's account of the war, because the encyclopedia is
    reliable. And we know it is reliable because its accounts, including this one,
    are accurate.
  prompt: Which one of the following most accurately describes a flaw in the argument?
  options:
    - text: It uses the accuracy of the very account in question as evidence that the account can be trusted.
      correct: true
      why: Reliability is supported by the account's accuracy, which is what the argument set out to show.
    - text: It relies on an encyclopedia written by people who were not historians.
      trap: unsupported
      why: Nothing is said about the authors.
    - text: It assumes that what is true of one encyclopedia is true of all of them.
      trap: not_present
      why: Only this encyclopedia is discussed.
    - text: It confuses the accuracy of an account with its completeness.
      trap: not_present
      why: Completeness never comes up.
    - text: It concludes that the account is accurate because no one has disproved it.
      trap: not_present
      why: The argument offers a circular reason, not a lack of disproof.
  tldr: Trusting the account because it's accurate, to prove it's accurate, is circular.
  steps:
    - label: Trace
      body: Account trustworthy ← encyclopedia reliable ← its accounts, including this one, are accurate.
    - label: Notice
      body: The last link assumes the conclusion.
  takeaway: Watch for support that quietly includes the very claim being argued for.

- id: lsat-lr-0135
  type: flaw
  kps: [kp-lsat-flaw-absence]
  difficulty: 1
  stimulus: >-
    The defense has not proven that the defendant was somewhere else at the time of
    the robbery. Therefore, the defendant must have been at the scene.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats the failure to prove a claim as proof that the opposite claim is true
      correct: true
      why: An unproven alibi doesn't place the defendant at the scene.
    - text: assumes that the defense attorney is incompetent
      trap: not_present
      why: The attorney's skill isn't discussed.
    - text: relies on eyewitness testimony
      trap: not_present
      why: No testimony is mentioned.
    - text: confuses the time of the robbery with its location
      trap: not_present
      why: That confusion doesn't occur.
    - text: overlooks the possibility that the robbery never took place
      trap: true_irrelevant
      why: Even granting the robbery happened, the inference still fails.
  tldr: '"No alibi" isn''t "proof of presence."'
  steps:
    - label: Premise
      body: No proof the defendant was elsewhere.
    - label: Flaw
      body: The conclusion needs positive evidence of presence.
  takeaway: Lack of evidence against a claim is not evidence for it.

- id: lsat-lr-0136
  type: flaw
  kps: [kp-lsat-flaw-possible-certain]
  difficulty: 3
  stimulus: >-
    Housing experts predict that home prices in Millport will rise over the coming
    year. Therefore, anyone who buys a house in Millport this year will be able to
    sell it next year for more than they paid.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: treats a prediction about prices in general as guaranteeing the outcome of every individual purchase
      correct: true
      why: A predicted overall rise is uncertain and can't ensure that each house gains value.
    - text: relies on experts whose predictions concern a matter outside their expertise
      trap: wrong_viewpoint
      why: Housing experts predicting housing prices are within their field.
    - text: assumes that home prices in Millport have risen in the past
      trap: not_present
      why: Past prices aren't mentioned.
    - text: fails to consider that some people buy houses to live in rather than to sell
      trap: true_irrelevant
      why: The conclusion concerns whether buyers could sell at a profit, not whether they want to.
    - text: confuses a cause of rising prices with an effect of them
      trap: not_present
      why: No causal claim is made.
  tldr: A forecast for the market can't guarantee a profit on every house.
  steps:
    - label: Evidence
      body: A prediction about overall prices.
    - label: Two leaps
      body: From predicted to certain, and from the market as a whole to every single house.
  takeaway: Watch for conclusions that turn a general, uncertain trend into a guarantee for each case.

- id: lsat-lr-0137
  type: flaw
  kps: [kp-lsat-flaw-straw-man]
  difficulty: 1
  stimulus: >-
    My opponent says the school district should reduce its budget by two percent.
    But I will never support a plan that leaves our children without teachers or
    textbooks.
  prompt: The reasoning above is most vulnerable to criticism on the grounds that it
  options:
    - text: responds to a far more drastic proposal than the one the opponent actually made
      correct: true
      why: A two percent cut is not a plan to eliminate teachers and textbooks.
    - text: assumes that teachers and textbooks are the district's only expenses
      trap: not_present
      why: The speaker doesn't make that assumption explicitly; the flaw is the distortion.
    - text: relies on an emotional appeal to parents' concern for their children
      trap: half_right
      why: The emotion rides on a distorted version of the proposal, which is the real flaw.
    - text: fails to state how much the budget should be
      trap: true_irrelevant
      why: The speaker needn't propose an alternative to be criticized for distortion.
    - text: attacks the opponent's character
      trap: not_present
      why: The speaker attacks a position, though a misstated one.
  tldr: A small cut is recast as a catastrophic one. That's a straw man.
  steps:
    - label: Actual proposal
      body: Cut the budget by 2%.
    - label: Response
      body: Rejects a plan that would eliminate teachers and textbooks, which no one proposed.
  takeaway: Compare the view being rebutted with the view actually stated.

- id: lsat-lr-0138
  type: flaw
  kps: [kp-lsat-quantifiers]
  difficulty: 3
  stimulus: >-
    Most professional chess players began playing chess before the age of ten. So
    most people who begin playing chess before the age of ten go on to become
    professional chess players.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: infers that most members of one group belong to a second group from the fact that most of the second group belong to the first
      correct: true
      why: Most professionals started early, but millions start early and very few become professionals.
    - text: relies on a sample of chess players that is too small
      trap: unsupported
      why: The sample size isn't given, and the error is in the logic.
    - text: assumes that starting chess early causes a player to become a professional
      trap: half_right
      why: The conclusion isn't causal; it reverses a "most" statement.
    - text: fails to define what counts as a professional chess player
      trap: true_irrelevant
      why: A precise definition wouldn't fix the reversal.
    - text: presumes that skill at chess is innate
      trap: not_present
      why: Innate skill isn't discussed.
  tldr: '"Most pros started young" doesn''t mean "most who start young become pros."'
  steps:
    - label: Premise
      body: Most of group P (pros) are in group Q (early starters).
    - label: Conclusion
      body: Most of Q are in P, a reversal that ignores how much bigger Q is.
  takeaway: '"Most" statements don''t reverse. Compare the sizes of the two groups.'

- id: lsat-lr-0139
  type: flaw
  kps: [kp-lsat-flaw-absence]
  difficulty: 3
  stimulus: >-
    Every witness agrees that the robber was tall. But eyewitness testimony is
    notoriously unreliable. So the robber was probably not tall.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: takes evidence that a claim is poorly supported as evidence that the claim is false
      correct: true
      why: Unreliable testimony weakens support for "tall" but gives no reason to think "not tall."
    - text: assumes that all the witnesses saw the robber from the same distance
      trap: not_present
      why: Viewing conditions aren't discussed.
    - text: relies on a generalization about testimony that is clearly false
      trap: unsupported
      why: The generalization may be true; the problem is what's inferred from it.
    - text: fails to consider that the witnesses may have discussed the robbery with one another
      trap: true_irrelevant
      why: That would further weaken the testimony, but still wouldn't support "not tall."
    - text: confuses the robber's height with the robber's identity
      trap: not_present
      why: Identity isn't discussed.
  tldr: Weak evidence for "tall" isn't evidence for "not tall."
  steps:
    - label: Premises
      body: Witnesses say tall; testimony is unreliable.
    - label: Flaw
      body: At most, we're left not knowing. Nothing points toward "not tall."
  takeaway: Undermining support for a claim leaves it unsupported, not refuted.

- id: lsat-lr-0140
  type: flaw
  kps: [kp-lsat-sampling]
  difficulty: 3
  stimulus: >-
    The buildings that survive from ancient Rome are remarkably sturdy. Clearly,
    Roman builders built sturdier buildings than modern builders do.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: overlooks the possibility that Rome's weaker buildings collapsed long ago, leaving only the sturdiest
      correct: true
      why: The survivors are a biased sample of Roman construction.
    - text: assumes that modern buildings will last as long as Roman ones
      trap: not_present
      why: The argument makes no prediction about modern buildings.
    - text: relies on the testimony of archaeologists
      trap: not_present
      why: No testimony is cited.
    - text: confuses sturdiness with beauty
      trap: not_present
      why: Beauty isn't mentioned.
    - text: fails to define what counts as a modern building
      trap: true_irrelevant
      why: A definition wouldn't fix the biased sample.
  tldr: Only the sturdiest Roman buildings survived to be seen.
  steps:
    - label: Sample
      body: Roman buildings that still stand.
    - label: Flaw
      body: Survival itself selects for sturdiness, so the sample isn't representative.
  takeaway: Samples filtered by survival or success overstate how good the typical case was.

- id: lsat-lr-0141
  type: flaw
  kps: [kp-lsat-part-whole]
  difficulty: 2
  stimulus: >-
    The average household income in Brentwood is higher than the average household
    income in Carlisle. So the Ito household, which is in Brentwood, has a higher
    income than the Park household, which is in Carlisle.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: applies a comparison of group averages to particular members of the groups
      correct: true
      why: Averages leave plenty of room for a low-income Brentwood household and a high-income Carlisle one.
    - text: assumes that income is the best measure of well-being
      trap: out_of_scope
      why: The conclusion concerns income only.
    - text: relies on income figures that may be out of date
      trap: unsupported
      why: Nothing suggests the figures are outdated.
    - text: overlooks the possibility that the two towns have different costs of living
      trap: true_irrelevant
      why: Costs of living don't affect which household earns more.
    - text: generalizes from two households to two whole towns
      trap: reversal
      why: It runs the other way, from towns to households.
  tldr: Higher town averages don't decide any particular comparison.
  steps:
    - label: Evidence
      body: Group averages.
    - label: Conclusion
      body: A claim about two specific households, which averages can't settle.
  takeaway: Averages describe groups. They don't fix where any individual falls.

- id: lsat-lr-0142
  type: flaw
  kps: [kp-lsat-plan]
  difficulty: 2
  stimulus: >-
    Building the new subway line will cause years of construction noise for the
    residents of Elm District. Therefore, the city should not build the new subway
    line.
  prompt: The argument is most vulnerable to criticism on the grounds that it
  options:
    - text: rejects a proposal because of one drawback without considering whether its benefits outweigh it
      correct: true
      why: Faster commutes or less traffic might justify temporary noise; the argument never weighs them.
    - text: assumes that the construction noise will be permanent
      trap: contradicts
      why: The argument itself says the noise will last years, not forever.
    - text: relies on the complaints of a few residents
      trap: not_present
      why: No complaints are cited.
    - text: fails to specify where the subway line will run
      trap: true_irrelevant
      why: The route isn't needed to see that the argument ignores benefits.
    - text: confuses a cause of noise with an effect of noise
      trap: not_present
      why: No such confusion occurs.
  tldr: One cost alone can't settle whether a project is worth doing.
  steps:
    - label: Evidence
      body: One drawback, noise.
    - label: Flaw
      body: A should-not conclusion needs costs and benefits compared.
  takeaway: Recommendations based on a single cost or benefit ignore the other side of the ledger.

- id: lsat-lr-0143
  type: flaw
  kps: [kp-lsat-numbers-proportions]
  difficulty: 3
  stimulus: >-
    Most of the car accidents in the county occur within five miles of the drivers'
    homes. So driving near home is more dangerous than driving far from home.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: fails to consider that most driving may be done within five miles of home
      correct: true
      why: If most miles are driven near home, most accidents would occur there even if it's no riskier.
    - text: assumes that accidents near home are less severe
      trap: not_present
      why: Severity isn't discussed.
    - text: relies on accident reports that may be incomplete
      trap: true_irrelevant
      why: Complete reports wouldn't fix the missing comparison of driving amounts.
    - text: presumes that all drivers in the county live in the county
      trap: unsupported
      why: Even if some don't, the argument's main gap remains.
    - text: confuses the cause of an accident with its location
      trap: not_present
      why: Location is the focus, but causes aren't confused.
  tldr: More accidents near home may just reflect more driving near home.
  steps:
    - label: Evidence
      body: The share of accidents near home.
    - label: Missing piece
      body: The share of driving near home. Risk is accidents per mile, not total accidents.
  takeaway: Counts of bad outcomes mean little without how often each situation occurs.

- id: lsat-lr-0144
  type: flaw
  kps: [kp-lsat-rival-cause]
  difficulty: 2
  stimulus: >-
    People who carry lighters are more likely than others to develop lung cancer.
    So carrying a lighter increases a person's risk of lung cancer.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: overlooks the possibility that some other factor, such as smoking, explains both lighter carrying and lung cancer
      correct: true
      why: Smokers carry lighters and get lung cancer more often; the lighter itself needn't do anything.
    - text: assumes that everyone who carries a lighter smokes
      trap: distortion
      why: The argument assumes nothing about smoking; that is the factor it ignores.
    - text: relies on data from a single hospital
      trap: unsupported
      why: The data's source isn't mentioned.
    - text: confuses lung cancer with other lung diseases
      trap: not_present
      why: No other disease is mentioned.
    - text: presumes that cancer risk can be measured
      trap: true_irrelevant
      why: Measuring risk isn't the problem; interpreting the correlation is.
  tldr: Smoking explains both the lighter and the cancer.
  steps:
    - label: Correlation
      body: Lighter carriers get more lung cancer.
    - label: Third factor
      body: Smoking leads to both.
  takeaway: Look for a common cause before accepting that one correlated factor causes the other.

- id: lsat-lr-0145
  type: flaw
  kps: [kp-lsat-quantifiers]
  difficulty: 3
  stimulus: >-
    Some members of the planning committee support the proposed zoning change. So
    some members of the planning committee do not support it.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: takes for granted that if some members of a group have a property, not all of them do
      correct: true
      why: '"Some" means at least one. All the members might support the change.'
    - text: assumes that the committee will vote on the proposal
      trap: not_present
      why: No vote is mentioned.
    - text: relies on a sample of committee members that is unrepresentative
      trap: not_present
      why: No sample is involved.
    - text: confuses supporting a proposal with voting for it
      trap: not_present
      why: Voting isn't mentioned.
    - text: presumes that committee members always agree with one another
      trap: contradicts
      why: The conclusion claims some members disagree, the opposite of this.
  tldr: '"Some" doesn''t rule out "all."'
  steps:
    - label: Premise
      body: At least one member supports it.
    - label: Flaw
      body: That's compatible with every member supporting it, so "some don't" doesn't follow.
  takeaway: In LSAT logic, "some" means "at least one, possibly all."

- id: lsat-lr-0146
  type: flaw
  kps: [kp-lsat-flaw-authority]
  difficulty: 3
  stimulus: >-
    Economists disagree about whether the proposed tax cut would increase economic
    growth. So no one can know whether it would, and the government should ignore
    economists' advice on the matter.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: infers from the fact that experts disagree that their views have no value at all
      correct: true
      why: Disagreeing experts can still narrow the range of plausible outcomes and inform the decision.
    - text: relies on the opinion of a single economist
      trap: not_present
      why: The argument cites disagreement among many economists.
    - text: assumes that the tax cut will pass
      trap: not_present
      why: Passage of the tax cut isn't discussed.
    - text: confuses economic growth with employment
      trap: not_present
      why: Employment isn't mentioned.
    - text: treats a claim about economists as a claim about economics
      trap: distortion
      why: The real leap is from disagreement to worthlessness.
  tldr: Expert disagreement doesn't make expert advice worthless.
  steps:
    - label: Evidence
      body: Economists disagree.
    - label: Two leaps
      body: That no one can know, and that their advice should be ignored entirely.
  takeaway: Uncertainty calls for weighing expert views, not discarding them.

- id: lsat-lr-0147
  type: flaw
  kps: [kp-lsat-numbers-proportions]
  difficulty: 3
  stimulus: >-
    The chance that any particular ticket will win the state lottery is one in ten
    million. So the person who won last week's lottery must have cheated.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: overlooks the fact that it was very likely some ticket would win, even though each ticket was unlikely to
      correct: true
      why: With millions of tickets sold, someone winning is expected; one person's win isn't suspicious by itself.
    - text: assumes that all lottery tickets cost the same
      trap: not_present
      why: Ticket prices are irrelevant to the reasoning.
    - text: relies on odds that are probably miscalculated
      trap: unsupported
      why: Nothing suggests the odds are wrong.
    - text: confuses the lottery's legality with its fairness
      trap: not_present
      why: Neither legality nor fairness in that sense is discussed.
    - text: presumes that the winner bought only one ticket
      trap: true_irrelevant
      why: Even a single ticket winning isn't evidence of cheating, given how many were sold.
  tldr: Each ticket is a long shot, but some ticket winning is nearly certain.
  steps:
    - label: Evidence
      body: Any one ticket has tiny odds.
    - label: Flaw
      body: That's true of every ticket, yet someone had to win, so the winner's luck proves nothing.
  takeaway: An unlikely outcome for each case can still be a likely outcome for some case.

- id: lsat-lr-0148
  type: flaw
  kps: [kp-lsat-flaw-consequences]
  difficulty: 2
  stimulus: >-
    If people came to believe that free will is an illusion, many of them would
    behave less responsibly. Therefore, free will is not an illusion.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: infers that a claim is false from the undesirable effects of believing it
      correct: true
      why: Whether free will exists doesn't depend on what believing in it would do to behavior.
    - text: relies on the authority of philosophers who believe in free will
      trap: not_present
      why: No authority is cited.
    - text: assumes that responsible behavior is always desirable
      trap: true_irrelevant
      why: Even granting that, bad consequences of a belief don't disprove it.
    - text: confuses believing something with knowing it
      trap: not_present
      why: The argument doesn't turn on that distinction.
    - text: generalizes from a few people to everyone
      trap: not_present
      why: The premise concerns "many" people, and the flaw lies elsewhere.
  tldr: Bad consequences of believing something don't make it false.
  steps:
    - label: Premise
      body: Believing X would have bad effects.
    - label: Conclusion
      body: X is false, which doesn't follow from effects on behavior.
  takeaway: Truth doesn't bend to consequences. Watch for "it would be bad if true, so it's false."

- id: lsat-lr-0149
  type: flaw
  kps: [kp-lsat-rival-cause]
  difficulty: 3
  stimulus: >-
    Since the city opened an anonymous hotline for reporting workplace harassment,
    reports of workplace harassment have doubled. Clearly, the hotline has made the
    city's workplaces less safe.
  prompt: The reasoning in the argument is flawed because the argument
  options:
    - text: overlooks the possibility that the hotline made existing harassment easier to report
      correct: true
      why: More reports may reflect more reporting, not more harassment.
    - text: assumes that anonymous reports are always false
      trap: not_present
      why: The argument treats the reports as real; it misreads what their rise means.
    - text: relies on too short a period of observation
      trap: unsupported
      why: The period isn't given, and length isn't the core issue.
    - text: confuses workplace harassment with other workplace problems
      trap: not_present
      why: No other problem is mentioned.
    - text: presumes that the hotline was expensive to operate
      trap: out_of_scope
      why: Cost isn't relevant to the conclusion.
  tldr: Easier reporting, not more harassment, could explain the jump.
  steps:
    - label: Evidence
      body: Reports doubled after the hotline opened.
    - label: Rival explanation
      body: The same harassment, now reported more often.
  takeaway: A rise in reports can reflect a change in reporting rather than in what's being reported.
