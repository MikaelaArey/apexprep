# LSAT knowledge points. Each one becomes a concept card in spaced review.
# front = the prompt shown on the card; back = the answer.

- id: kp-lsat-rival-cause
  section: LR
  title: Rival causes
  front: >-
    An argument concludes that X causes Y because X and Y show up together.
    What's the strongest way to weaken it?
  back: >-
    Name a rival cause: something else that differs between the groups and could
    produce Y. Reversed causation (Y causes X) and a skewed sample also work.

- id: kp-lsat-strengthen-causal
  section: LR
  title: Strengthening a causal claim
  front: >-
    How do you strengthen "X caused the difference between these two groups"?
  back: >-
    Rule out the alternatives: show the groups were alike before X (same baseline),
    or that no other factor differs between them.

- id: kp-lsat-negation-test
  section: LR
  title: The negation test
  front: How do you confirm that an answer is a necessary assumption?
  back: >-
    Negate it. If the negated version wrecks the argument, the argument needs it.
    If the argument survives, it isn't necessary.

- id: kp-lsat-contrapositive
  section: LR
  title: Contrapositives
  front: >-
    "If P, then Q." What else must be true?
  back: >-
    If not Q, then not P. "If Q, then P" does not follow; that's a reversal.

- id: kp-lsat-sufficient-bridge
  section: LR
  title: Sufficient assumptions
  front: What does the right answer to a sufficient assumption question do?
  back: >-
    It links the premises to the conclusion's new term so that, added to the
    premises, the conclusion is guaranteed. Check the direction of every
    conditional.

- id: kp-lsat-necessary-vs-sufficient
  section: LR
  title: Necessary vs. sufficient
  front: >-
    "Every successful restaurant advertises." Does advertising guarantee success?
  back: >-
    No. Advertising is necessary for success, not sufficient. Treating a
    requirement as a guarantee is one of the most common LSAT flaws.

- id: kp-lsat-part-whole
  section: LR
  title: Parts and wholes
  front: Each part of a whole has a property. Does the whole have it too?
  back: >-
    Not necessarily. Assuming it does is the composition flaw. Assuming each
    part shares a property of the whole is the division flaw.

- id: kp-lsat-numbers-proportions
  section: LR
  title: Numbers vs. proportions
  front: >-
    Fewer than half of the eligible students studied abroad. What follows about
    the counts?
  back: >-
    Eligible students outnumber those who went by more than two to one. But a
    record number who went doesn't prove a record number were eligible.

- id: kp-lsat-conclusion-signals
  section: LR
  title: Finding the main conclusion
  front: >-
    An argument opens with someone else's view, then says "But this view cannot be
    right." Where is the main conclusion?
  back: >-
    In the rejection itself: "this view cannot be right." The sentences after it
    are the evidence for that rejection.

- id: kp-lsat-concession
  section: LR
  title: Concessions
  front: What does "Admittedly" or "Granted" usually signal?
  back: >-
    A concession: a point the author accepts even though it seems to cut against
    the conclusion. It is neither the conclusion nor support for it.

- id: kp-lsat-paradox-both
  section: LR
  title: Resolving a paradox
  front: What must the right answer to a paradox question do?
  back: >-
    Show how both surprising facts can be true at once, without denying either
    one.

- id: kp-lsat-principle-match
  section: LR
  title: Matching a principle
  front: How do you choose a principle that justifies an argument?
  back: >-
    Match it to this argument's specific evidence and conclusion. It should carry
    you from the premises to the conclusion, and no further.

- id: kp-rc-main-point
  section: RC
  title: Main point
  front: What makes a main-point answer correct in Reading Comprehension?
  back: >-
    It covers the whole passage, including the author's own position, not one
    paragraph's detail or a view the author argues against.

- id: kp-rc-function
  section: RC
  title: Function questions
  front: >-
    "The author mentions X primarily in order to…" What are you really being
    asked?
  back: >-
    Why X is there: which claim in its paragraph it supports or undercuts.

- id: kp-rc-viewpoints
  section: RC
  title: Tracking viewpoints
  front: >-
    A question asks what the "defenders" argued. What's the most common trap?
  back: >-
    An answer that appears in the passage but belongs to a different group.
    Track who says what.

- id: kp-rc-extreme-language
  section: RC
  title: Extreme answers
  front: Why are "always," "never" and "eliminates" risky in RC answers?
  back: >-
    Passages rarely support absolutes. Prefer the answer the text actually proves,
    even if it sounds modest.

- id: kp-lsat-parallel-structure
  section: LR
  title: Parallel reasoning
  front: How do you match a parallel reasoning answer?
  back: >-
    Match the structure, not the topic: the same conditional links, the same
    quantifiers (all, most, some) and the same kind of conclusion. A valid
    argument needs a valid match; a flawed one needs the same flaw.

- id: kp-lsat-point-at-issue
  section: LR
  title: Point at issue
  front: What must be true of the right answer to a disagreement question?
  back: >-
    Both speakers must take a position on it, and their positions must conflict.
    If either speaker is silent on it, or they agree, it's wrong.

- id: kp-lsat-counterexample
  section: LR
  title: Counterexamples
  front: >-
    Someone claims "no X has ever been Y," and the reply names one X that was Y.
    What method is that?
  back: >-
    A counterexample. One case is enough to refute a universal claim, but it
    doesn't show that most X are Y.

- id: kp-lsat-evaluate
  section: LR
  title: Evaluate questions
  front: What makes an answer right on an "evaluate the argument" question?
  back: >-
    Its answer would matter either way: one answer strengthens the argument and
    the other weakens it. Rival causes are the usual target.

- id: kp-lsat-source-attack
  section: LR
  title: Attacking the source
  front: >-
    "Her argument should be dismissed because she owns rental property." What's
    the flaw?
  back: >-
    An ad hominem: it attacks the person instead of the reasoning. A motive to
    argue something doesn't make the argument wrong.

- id: kp-lsat-sampling
  section: LR
  title: Unrepresentative samples
  front: >-
    A survey of a cycling club shows support for bike lanes. Why can't you
    conclude that most residents support them?
  back: >-
    The sample isn't representative: club members differ from residents in
    exactly the way that affects the answer.
