  model: concept-spontaneity
  type: thermodynamics
  kps:
    - kp-mcat-gibbs-temperature
  outline:
    category: 5E
    sirs: 1
  difficulty: 3
  prompt: 'A reaction with ΔH < 0 and ΔS > 0 is:'
  options:
    - text: Spontaneous at all temperatures
      correct: true
      why: Both terms make ΔG negative.
    - text: Spontaneous only at low temperatures
      trap: lookalike
      why: >-
        Spontaneous only at low temperatures: ΔH < 0 and ΔS < 0, so ΔH must outweigh the unfavorable −TΔS
        term.
    - text: Nonspontaneous at all temperatures
      trap: lookalike
      why: 'Nonspontaneous at all temperatures: ΔH > 0 and ΔS < 0, so ΔG is always positive.'
    - text: Spontaneous only at high temperatures
      trap: lookalike
      why: 'Spontaneous only at high temperatures: ΔH > 0 and ΔS > 0, so the −TΔS term must outweigh ΔH.'
  tldr: 'Spontaneous at all temperatures: ΔH < 0 and ΔS > 0, so ΔG is always negative.'
  steps:
    - label: Spot the clue
      body: Both terms make ΔG negative.
    - label: Name it
      body: 'Spontaneous at all temperatures: ΔH < 0 and ΔS > 0, so ΔG is always negative.'
  takeaway: >-
    ΔG = ΔH − TΔS. When ΔH and ΔS have the same sign, temperature decides: entropy wins at high T, enthalpy
    wins at low T.
  siblings:
    - mcat-cp-6176
    - mcat-cp-6177
    - mcat-cp-6178
    - mcat-cp-6179
