  prompt: 'The main attraction between methane molecules is:'
  options:
    - text: London dispersion forces
      correct: true
      why: Methane is nonpolar, so only dispersion forces act.
    - text: Dipole–dipole interactions
      trap: lookalike
      why: 'Dipole–dipole interactions: attractions between permanent dipoles of polar molecules.'
    - text: Hydrogen bonding
      trap: lookalike
      why: 'Hydrogen bonding: strong dipole attractions involving H bonded to N, O or F.'
    - text: Ion–dipole interactions
      trap: lookalike
      why: >-
        Ion–dipole interactions: attractions between an ion and a polar molecule, as in salts dissolving in
        water.
  tldr: >-
    London dispersion forces: temporary dipoles present in all molecules; stronger in larger, more polarizable
    molecules.
  steps:
    - label: Spot the clue
      body: Methane is nonpolar, so only dispersion forces act.
    - label: Name it
      body: >-
        London dispersion forces: temporary dipoles present in all molecules; stronger in larger, more
        polarizable molecules.
  takeaway: Bigger electron clouds mean stronger dispersion forces.
