    current on their own. This is a:
  options:
    - text: Galvanic cell
      correct: true
      why: 'Two different metals react spontaneously to produce current: a galvanic cell.'
    - text: Concentration cell
      trap: lookalike
      why: >-
        Concentration cell: a galvanic cell with identical electrodes in solutions of different concentration;
        E° = 0, but it still produces a voltage.
    - text: Electrolytic cell
      trap: lookalike
      why: >-
        Electrolytic cell: uses an external power source to drive a nonspontaneous reaction; the anode is
        positive.
    - text: Fuel cell
      trap: lookalike
      why: 'Fuel cell: a galvanic cell continuously supplied with reactants such as H₂ and O₂.'
  tldr: 'Galvanic cell: runs a spontaneous redox reaction (ΔG < 0) to produce current; the anode is negative.'
  steps:
    - label: Spot the clue
      body: 'Two different metals react spontaneously to produce current: a galvanic cell.'
    - label: Name it
      body: 'Galvanic cell: runs a spontaneous redox reaction (ΔG < 0) to produce current; the anode is negative.'
  takeaway: 'Galvanic: spontaneous, makes electricity.'
