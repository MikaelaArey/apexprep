  difficulty: 1
  prompt: Which group’s elements react violently with water to form strong bases and +1 ions?
  options:
    - text: Alkali metals
      correct: true
      why: Group 1 metals give up one electron easily.
    - text: Transition metals
      trap: lookalike
      why: >-
        Transition metals: d-block elements with partly filled d orbitals, multiple oxidation states and often
        colored compounds.
    - text: Alkaline earth metals
      trap: lookalike
      why: 'Alkaline earth metals: group 2: two valence electrons, form +2 ions such as Mg²⁺ and Ca²⁺.'
    - text: Noble gases
      trap: lookalike
      why: >-
        Noble gases: group 18: full valence shells, nearly inert, with the highest ionization energies in each
        period.
  tldr: >-
    Alkali metals: group 1: one valence electron, form +1 ions and react vigorously with water to form strong
    bases.
  steps:
    - label: Spot the clue
      body: Group 1 metals give up one electron easily.
    - label: Name it
      body: >-
        Alkali metals: group 1: one valence electron, form +1 ions and react vigorously with water to form
        strong bases.
  takeaway: Alkali metals lose their single valence electron easily.
