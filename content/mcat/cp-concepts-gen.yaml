  model: concept-nuclear-decay
  type: nuclear
  kps:
    - kp-mcat-decay-types
  outline:
    category: 4E
    sirs: 1
  difficulty: 2
  prompt: Uranium-238 becomes thorium-234. What type of decay occurred?
  options:
    - text: Alpha decay
      correct: true
      why: A drops by 4 and Z drops by 2 (92 → 90).
    - text: Positron emission
      trap: lookalike
      why: 'Positron emission: a proton becomes a neutron and emits a positron: atomic number falls by 1.'
    - text: Beta-minus decay
      trap: lookalike
      why: 'Beta-minus decay: a neutron becomes a proton and emits an electron: atomic number rises by 1.'
    - text: Gamma decay
      trap: lookalike
      why: 'Gamma decay: an excited nucleus emits a high-energy photon: atomic and mass numbers are unchanged.'
  tldr: 'Alpha decay: emits a helium nucleus: mass number falls by 4, atomic number by 2.'
  steps:
    - label: Spot the clue
      body: A drops by 4 and Z drops by 2 (92 → 90).
    - label: Name it
      body: 'Alpha decay: emits a helium nucleus: mass number falls by 4, atomic number by 2.'
  takeaway: Alpha is the only common decay that changes mass number; paper stops it.
  siblings:
    - mcat-cp-6151
    - mcat-cp-6152
    - mcat-cp-6153
    - mcat-cp-6154
