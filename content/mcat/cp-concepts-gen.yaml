  prompt: At constant temperature, halving a gas’s volume doubles its pressure. Which law describes this?
  options:
    - text: Boyle’s law
      correct: true
      why: P and V are inversely proportional at constant T.
    - text: Dalton’s law
      trap: lookalike
      why: 'Dalton’s law: the total pressure of a gas mixture equals the sum of the partial pressures.'
    - text: Avogadro’s law
      trap: lookalike
      why: 'Avogadro’s law: at constant temperature and pressure, volume is proportional to moles of gas.'
    - text: Graham’s law
      trap: lookalike
      why: 'Graham’s law: effusion rate is inversely proportional to the square root of molar mass.'
  tldr: 'Boyle’s law: at constant temperature, pressure and volume are inversely proportional.'
  steps:
    - label: Spot the clue
      body: P and V are inversely proportional at constant T.
    - label: Name it
      body: 'Boyle’s law: at constant temperature, pressure and volume are inversely proportional.'
