  prompt: Noise-canceling headphones produce sound waves that cancel incoming noise. Which wave phenomenon is this?
  options:
    - text: Interference
      correct: true
      why: An inverted wave interferes destructively with the noise.
    - text: Diffraction
      trap: lookalike
      why: 'Diffraction: waves bending around obstacles or spreading through openings.'
    - text: Beats
      trap: lookalike
      why: 'Beats: a periodic swelling and fading of loudness when two slightly different frequencies combine.'
    - text: Doppler effect
      trap: lookalike
      why: 'Doppler effect: a shift in observed frequency caused by relative motion of source and observer.'
  tldr: 'Interference: waves adding or canceling where they overlap.'
  steps:
    - label: Spot the clue
      body: An inverted wave interferes destructively with the noise.
    - label: Name it
      body: 'Interference: waves adding or canceling where they overlap.'
  takeaway: 'In phase: constructive. Half a wavelength out of phase: destructive.'
