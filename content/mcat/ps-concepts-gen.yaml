        just-noticeable difference).
    - text: Perceptual constancy
      trap: lookalike
      why: >-
        Perceptual constancy: perceiving an object as unchanged despite changes in the image it casts on the
        retina.
    - text: Bottom-up processing
      trap: lookalike
      why: 'Bottom-up processing: building a perception from raw sensory features without relying on expectations.'
  tldr: 'Sensory adaptation: reduced sensitivity to a constant, unchanging stimulus.'
