      body: A small first request (signing) made the larger second request (donating) easier to accept.
    - label: Name it
      body: >-
        Foot-in-the-door technique: getting agreement to a small request to make a larger one more likely to
        succeed.
  takeaway: 'Foot in the door: small yes first, big ask second.'
