  prompt: >-
    A study finds that ice cream sales and drowning deaths rise and fall together. Hot weather, which
    increases both, is a:
  options:
    - text: Confounding variable
      correct: true
      why: Hot weather is linked to both variables and explains their correlation.
    - text: Observer bias
      trap: lookalike
      why: 'Observer bias: researchers’ expectations shaping how they record or interpret outcomes.'
    - text: Regression to the mean
      trap: lookalike
      why: 'Regression to the mean: extreme scores tending to move toward the average when measured again.'
    - text: Selection bias
      trap: lookalike
      why: >-
        Selection bias: a sample that differs systematically from the population because of how participants
        were chosen.
  tldr: >-
    Confounding variable: a third variable linked to both the independent and dependent variables that offers
    another explanation for the result.
  steps:
    - label: Spot the clue
      body: Hot weather is linked to both variables and explains their correlation.
    - label: Name it
      body: >-
        Confounding variable: a third variable linked to both the independent and dependent variables that
        offers another explanation for the result.
  takeaway: A confound must relate to both the cause and the effect. Random assignment is the cure.
