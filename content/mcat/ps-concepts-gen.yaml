        Cognitive dissonance: discomfort from holding conflicting beliefs, or acting against them, which
        people often reduce by changing an attitude.
    - text: Door-in-the-face technique
      trap: lookalike
      why: >-
        Door-in-the-face technique: making a large request you expect to be refused, then a smaller one that
        seems reasonable by comparison.
    - text: Lowball technique
      trap: lookalike
      why: 'Lowball technique: securing agreement to a deal, then adding costs once the person is committed.'
  tldr: >-
    Foot-in-the-door technique: getting agreement to a small request to make a larger one more likely to
    succeed.
