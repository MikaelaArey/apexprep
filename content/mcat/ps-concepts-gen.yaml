    and society running. Which theoretical approach does this reflect?
  options:
    - text: Functionalism
      correct: true
      why: It explains schools by the function they serve for society’s stability.
    - text: Rational choice theory
      trap: lookalike
      why: >-
        Rational choice theory: assumes people act by weighing costs and benefits to maximize their own
        interests.
    - text: Symbolic interactionism
      trap: lookalike
      why: >-
        Symbolic interactionism: studies how people build society through everyday interactions and the
        meanings they give symbols.
    - text: Conflict theory
      trap: lookalike
      why: 'Conflict theory: sees society as shaped by competition between groups for power and scarce resources.'
  tldr: 'Functionalism: sees society as interdependent parts that each serve a function in keeping it stable.'
