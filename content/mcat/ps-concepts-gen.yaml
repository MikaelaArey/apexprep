      correct: true
      why: Uneven dropout left a sample skewed toward successes.
    - text: Regression to the mean
      trap: lookalike
      why: 'Regression to the mean: extreme scores tending to move toward the average when measured again.'
    - text: Confounding variable
      trap: lookalike
      why: >-
        Confounding variable: a third variable linked to both the independent and dependent variables that
        offers another explanation for the result.
    - text: Selection bias
      trap: lookalike
      why: >-
        Selection bias: a sample that differs systematically from the population because of how participants
        were chosen.
  tldr: 'Attrition bias: participants dropping out unevenly in a way that skews the results.'
  steps:
    - label: Spot the clue
      body: Uneven dropout left a sample skewed toward successes.
    - label: Name it
      body: 'Attrition bias: participants dropping out unevenly in a way that skews the results.'
  takeaway: When dropouts differ from those who stay, the remaining sample no longer represents the starting groups.
