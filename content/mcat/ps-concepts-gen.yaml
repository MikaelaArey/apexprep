  prompt: >-
    According to this theory, we feel afraid because we notice our heart pounding and our hands trembling.
    Which theory of emotion does this describe?
  options:
    - text: James–Lange theory
      correct: true
      why: Emotion is the perception of bodily arousal, which comes first.
    - text: Schachter–Singer theory
      trap: lookalike
      why: >-
        Schachter–Singer theory: arousal plus a cognitive label for it, drawn from context, produces the
        emotion.
    - text: Lazarus’s appraisal theory
      trap: lookalike
      why: >-
        Lazarus’s appraisal theory: a cognitive appraisal of the situation comes first, then arousal and
        emotion follow.
    - text: Cannon–Bard theory
      trap: lookalike
      why: >-
        Cannon–Bard theory: arousal and the emotional experience happen at the same time, independently of
        each other.
  tldr: 'James–Lange theory: physiological arousal comes first, and the emotion is our perception of that arousal.'
  steps:
    - label: Spot the clue
      body: Emotion is the perception of bodily arousal, which comes first.
    - label: Name it
      body: >-
        James–Lange theory: physiological arousal comes first, and the emotion is our perception of that
        arousal.
  takeaway: 'James–Lange: we feel afraid because we tremble.'
