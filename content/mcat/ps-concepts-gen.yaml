      trap: lookalike
      why: >-
        Case–control study: comparing people who have an outcome with similar people who don’t, looking back
        for past exposures.
  tldr: >-
    Randomized controlled experiment: random assignment to conditions that the researcher manipulates; the
    design that can show causation.
  steps:
