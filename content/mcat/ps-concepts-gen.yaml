  prompt: >-
    A gambler keeps pulling a slot machine’s lever, which pays out after an unpredictable number of pulls.
    Which reinforcement schedule is this?
  options:
    - text: Variable-ratio schedule
      correct: true
      why: Payouts depend on the number of responses, and that number varies.
    - text: Fixed-ratio schedule
      trap: lookalike
      why: >-
        Fixed-ratio schedule: reinforcement after a set number of responses; high response rate with a pause
        after each reward.
    - text: Variable-interval schedule
      trap: lookalike
      why: >-
        Variable-interval schedule: reinforcement for the first response after unpredictable amounts of time;
        slow, steady responding.
    - text: Continuous reinforcement
      trap: lookalike
      why: >-
        Continuous reinforcement: reinforcement after every response; fastest learning but also fastest
        extinction.
  tldr: >-
    Variable-ratio schedule: reinforcement after an unpredictable number of responses; the highest, steadiest
    rate and the most resistance to extinction.
  steps:
    - label: Spot the clue
      body: Payouts depend on the number of responses, and that number varies.
    - label: Name it
      body: >-
        Variable-ratio schedule: reinforcement after an unpredictable number of responses; the highest,
        steadiest rate and the most resistance to extinction.
  takeaway: Variable ratio (slot machines) gives the highest response rate and the most resistance to extinction.
