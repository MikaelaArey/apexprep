  prompt: >-
    When a classmate trips on the stairs, Ana decides he is clumsy. When she trips on the same stairs, she
    blames the wet floor. Which bias does this best illustrate?
  options:
    - text: Actor–observer bias
      correct: true
      why: She explains her own slip by the situation but his by his character.
    - text: Hindsight bias
      trap: lookalike
      why: 'Hindsight bias: feeling, after learning an outcome, that you knew it all along.'
    - text: Fundamental attribution error
      trap: lookalike
      why: >-
        Fundamental attribution error: overweighting character and underweighting the situation when
        explaining other people’s behavior.
    - text: Self-serving bias
      trap: lookalike
      why: 'Self-serving bias: crediting your successes to yourself and blaming your failures on outside factors.'
  tldr: >-
    Actor–observer bias: blaming the situation for your own behavior but character for the same behavior in
    others.
  steps:
    - label: Spot the clue
      body: She explains her own slip by the situation but his by his character.
    - label: Name it
      body: >-
        Actor–observer bias: blaming the situation for your own behavior but character for the same behavior
        in others.
  takeaway: Actor–observer bias needs a contrast between how you explain yourself and how you explain others.
