  prompt: 'Epinephrine binding to a β-adrenergic receptor activates adenylyl cyclase through a:'
  options:
    - text: G protein–coupled receptor
      correct: true
      why: β-receptors activate Gs, which stimulates adenylyl cyclase.
    - text: Intracellular receptor
      trap: lookalike
      why: >-
        Intracellular receptor: a receptor inside the cell, often acting as a transcription factor, for
        lipid-soluble signals such as steroids.
    - text: Ligand-gated ion channel
      trap: lookalike
      why: >-
        Ligand-gated ion channel: a membrane channel that opens directly when its ligand binds, changing ion
        flow within milliseconds.
    - text: Receptor tyrosine kinase
      trap: lookalike
      why: >-
        Receptor tyrosine kinase: a membrane receptor that dimerizes and phosphorylates tyrosines, launching
        cascades such as Ras–MAPK.
  tldr: >-
    G protein–coupled receptor: a seven-pass membrane receptor that activates a G protein, which then
    regulates enzymes such as adenylyl cyclase or phospholipase C.
  steps:
    - label: Spot the clue
      body: β-receptors activate Gs, which stimulates adenylyl cyclase.
    - label: Name it
      body: >-
