  prompt: 'An inhibitor raises the apparent Km but leaves Vmax unchanged. This is:'
  options:
    - text: Competitive inhibition
      correct: true
      why: Higher apparent Km with the same Vmax is the competitive pattern.
    - text: Mixed inhibition
      trap: lookalike
      why: >-
        Mixed inhibition: the inhibitor binds an allosteric site with different affinities for free enzyme and
        ES complex: Vmax falls and Km changes.
    - text: Noncompetitive inhibition
      trap: lookalike
      why: >-
        Noncompetitive inhibition: the inhibitor binds elsewhere equally well with or without substrate: Vmax
        falls, Km is unchanged.
    - text: Uncompetitive inhibition
      trap: lookalike
      why: >-
        Uncompetitive inhibition: the inhibitor binds only the enzyme–substrate complex: Vmax and Km both
        fall.
  tldr: 'Competitive inhibition: the inhibitor competes for the active site: apparent Km rises, Vmax is unchanged.'
  steps:
    - label: Spot the clue
      body: Higher apparent Km with the same Vmax is the competitive pattern.
    - label: Name it
      body: >-
        Competitive inhibition: the inhibitor competes for the active site: apparent Km rises, Vmax is
        unchanged.
  takeaway: 'Competitive: more substrate wins, so Vmax survives.'
  siblings:
