  prompt: What volume does 0.5 mol of an ideal gas occupy at STP (0 °C, 1 atm)?
  options:
    - text: 11.2 L
      correct: true
      why: 0.5 mol × 22.4 L/mol = 11.2 L.
    - text: 12.3 L
      trap: lookalike
      why: 24.5 L/mol is the molar volume near 25 °C, not at STP.
    - text: 44.8 L
      trap: wrong_direction
      why: That divides by the moles instead of multiplying.
    - text: 4.2 L
      trap: lookalike
      why: That uses the gas constant R as if it were the molar volume.
  tldr: At STP each mole takes 22.4 L, so 0.5 mol occupies 11.2 L.
  steps:
    - label: Recall
      body: At STP, 1 mol of ideal gas = 22.4 L.
    - label: Compute
      body: 0.5 × 22.4 = 11.2 L.
  takeaway: 'At STP: volume (L) = moles × 22.4.'
  siblings:
    - mcat-cp-5017
