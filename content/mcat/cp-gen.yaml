      correct: true
      why: P = V²/R, so doubling V multiplies P by 2² = 4.
    - text: It doubles.
      trap: skipped_step
      why: Power depends on V squared, not V.
    - text: It stays the same.
      trap: false_fact
      why: With R fixed, power rises with voltage.
    - text: It halves.
      trap: wrong_direction
      why: More voltage across the same resistor means more power.
  tldr: P = V²/R, so 2× voltage gives 4× power.
  steps:
    - label: Formula
      body: At constant R, P = V²/R.
    - label: Scale
      body: V → 2V gives P → (2V)²/R = 4P.
  takeaway: Power through a fixed resistor scales with the square of voltage (or current).
