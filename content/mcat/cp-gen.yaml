    - text: 200 W
      trap: lookalike
      why: V × R isn’t a power formula. Use V²/R or IV.
    - text: 20 W
      trap: skipped_step
      why: There’s no ½ in P = V²/R. That factor belongs to capacitor energy.
  tldr: P = V²/R = 400/10 = 40 W.
  steps:
    - label: Pick the formula
      body: With V and R known, P = V²/R.
    - label: Compute
      body: 20² = 400; 400/10 = 40 W.
  takeaway: P = IV = I²R = V²/R. Choose the form that matches the quantities you know.
