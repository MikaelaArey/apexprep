  tldr: PV/T is constant, so V scales by T/P = 3/2 = 1.5.
  steps:
    - label: Relationship
      body: For a fixed amount of gas, V ∝ T/P (T in kelvin).
    - label: Apply
      body: T changes by 3× and P by 2×.
    - label: Compute
      body: V changes by 3/2 = 1.5.
  takeaway: 'Volume scales with kelvin temperature and inversely with pressure: V₂/V₁ = (T₂/T₁)(P₁/P₂).'
