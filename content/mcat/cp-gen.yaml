  outline:
    category: 4C
    sirs: 2
  difficulty: 2
  prompt: >-
    A galvanic cell is built from Cu²⁺/Cu and Zn²⁺/Zn half-cells. The standard reduction potentials are
    Cu²⁺/Cu: 0.34 V and Zn²⁺/Zn: −0.76 V. What is E°cell?
  options:
    - text: 1.10 V
      correct: true
      why: 'Cu is the cathode (higher E°): 0.34 − (−0.76) = 1.10 V.'
    - text: −0.42 V
      trap: sign_flip
      why: That adds the reduction potentials. Subtract the anode’s from the cathode’s.
    - text: −1.10 V
      trap: sign_flip
      why: That subtracts in the wrong order. A galvanic cell has a positive E°cell.
    - text: 1.20 V
      trap: lookalike
      why: Recompute E°(cathode) − E°(anode) with the signs given.
  tldr: E°cell = E°cathode − E°anode = 0.34 − (−0.76) = 1.10 V.
  steps:
    - label: Assign
      body: The half-cell with the higher reduction potential (Cu²⁺/Cu) is the cathode; Zn²⁺/Zn is the anode.
    - label: Compute
      body: 0.34 − (−0.76) = 1.10 V.
  takeaway: E°cell = E°red(cathode) − E°red(anode); a spontaneous (galvanic) cell is positive.
  siblings:
    - mcat-cp-5099
    - mcat-cp-5100
    - mcat-cp-5101
    - mcat-cp-5102
