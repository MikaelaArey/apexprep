- id: mcat-cp-5011
  model: cp-solutions
  type: solutions
  kps:
    - kp-mcat-dilution
  outline:
    category: 5A
    sirs: 2
  difficulty: 1
  prompt: >-
    50 mL of a 2 M NaCl solution is diluted with water to a final volume of 250 mL. What is the new
    concentration?
  options:
    - text: 0.4 M
      correct: true
      why: M₂ = M₁V₁/V₂ = (2 × 50)/250 = 0.4 M.
    - text: 10 M
      trap: wrong_direction
      why: That inverts the volume ratio. Dilution can only lower the concentration.
    - text: 0.333 M
      trap: misread_data
      why: That treats 250 mL as the water added. 250 mL is the final volume.
    - text: 4 M
      trap: power_of_ten
      why: A factor of 10 slipped in. Check the arithmetic.
  tldr: M₁V₁ = M₂V₂ → 2 × 50 = M₂ × 250, so M₂ = 0.4 M.
  steps:
    - label: Set up
      body: 'Moles of solute don’t change: M₁V₁ = M₂V₂.'
    - label: Solve
      body: M₂ = (2 M × 50 mL)/250 mL = 0.4 M.
  takeaway: In M₁V₁ = M₂V₂, V₂ is the final total volume, not the water added.
  siblings:
    - mcat-cp-5012
    - mcat-cp-5013
    - mcat-cp-5014
    - mcat-cp-5015
