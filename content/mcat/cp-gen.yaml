  steps:
    - label: Vertical
      body: Falling 20 m from rest takes t = √(2 × 20/10) = 2 s.
    - label: Horizontal
      body: No horizontal acceleration, so x = 5 m/s × 2 s = 10 m.
  takeaway: Treat horizontal and vertical motion separately. The height alone sets the flight time.
