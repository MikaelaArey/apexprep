- id: mcat-cp-5103
  model: cp-thermodynamics
  type: thermodynamics
  kps:
    - kp-mcat-gibbs-temperature
  outline:
    category: 5E
    sirs: 2
  difficulty: 3
  prompt: >-
    A reaction has ΔH = +30 kJ/mol and ΔS = +150 J/(mol·K). Assuming both are constant, when is it
    spontaneous?
  options:
    - text: Only above 200 K
      correct: true
      why: 'ΔG = ΔH − TΔS < 0 once TΔS exceeds ΔH: T > 30000/150 = 200 K.'
    - text: Only below 200 K
      trap: sign_flip
      why: With ΔH and ΔS both positive, high temperatures favor spontaneity.
    - text: Only above 0.2 K
      trap: power_of_ten
      why: That divides kJ by J. Convert ΔH to joules first.
    - text: At all temperatures
      trap: lookalike
      why: That needs ΔH < 0 and ΔS > 0. Here the signs match, so there’s a crossover.
  tldr: T = ΔH/ΔS = 30000/150 = 200 K; spontaneous above it.
  steps:
    - label: Signs
      body: 'ΔH > 0 and ΔS > 0: spontaneous at high T.'
    - label: Crossover
      body: ΔG = 0 at T = ΔH/ΔS = 30000 J ÷ 150 J/K = 200 K.
  takeaway: 'When ΔH and ΔS share a sign, temperature decides: the crossover is T = ΔH/ΔS (in matching units).'
  siblings:
    - mcat-cp-5104
    - mcat-cp-5105
    - mcat-cp-5106
