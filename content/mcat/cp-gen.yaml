    it take to reach the ground?
  options:
    - text: 3 s
      correct: true
      why: 45 = ½(10)t², so t² = 9 and t = 3 s.
    - text: 2.1 s
      trap: lookalike
      why: That drops the ½ from h = ½gt².
    - text: 9 s
      trap: skipped_step
      why: That’s t². Take the square root.
    - text: 4.5 s
      trap: lookalike
      why: h/g isn’t a time formula here; the stone accelerates.
  tldr: h = ½gt² → 45 = 5t² → t = 3 s.
  steps:
    - label: Recall
      body: 'From rest: h = ½gt².'
    - label: Solve
      body: t = √(2h/g) = √(90/10) = 3 s.
  takeaway: 'Dropped from rest: t = √(2h/g), and mass doesn’t matter.'
  siblings:
    - mcat-cp-5047
    - mcat-cp-5048
    - mcat-cp-5049
