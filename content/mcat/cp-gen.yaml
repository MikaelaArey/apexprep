  options:
    - text: 10 dB
      correct: true
      why: Δβ = 10 log(10) = 10 dB.
    - text: 1 dB
      trap: skipped_step
      why: That leaves out the factor of 10 in β = 10 log(I/I₀).
    - text: 20 dB
      trap: power_of_ten
      why: Each tenfold step adds 10 dB, not 20.
    - text: 5 dB
      trap: skipped_step
      why: Each tenfold step adds 10 dB, not 5.
  tldr: Each 10× in intensity adds 10 dB, so ×10 adds 10 dB.
  steps:
    - label: Formula
      body: β = 10 log(I/I₀).
    - label: Compute
      body: 10 × log(10) = 10 × 1 = 10 dB.
  takeaway: 'Sound level is logarithmic: +10 dB per tenfold increase in intensity.'
