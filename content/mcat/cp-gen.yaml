  steps:
    - label: Continuity
      body: A₁v₁ = A₂v₂ for an incompressible fluid.
    - label: Scale
      body: Area changes by (0.5)² = 0.25, so speed changes by 4.
  takeaway: Speed scales inversely with area, which goes with the radius squared.
