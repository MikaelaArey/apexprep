  outline:
    category: 4B
    sirs: 2
  difficulty: 2
  prompt: >-
    A block of wood with density 600 kg/m³ floats in fresh water (density 1000 kg/m³). What fraction of its
    volume is below the surface?
  options:
    - text: 60%
      correct: true
      why: Submerged fraction = 600/1000 = 60%.
    - text: 40%
      trap: wrong_direction
      why: That’s the fraction above the surface.
    - text: 166.67%
      trap: wrong_direction
      why: That inverts the ratio; a floating object can’t be more than 100% submerged.
    - text: 100%
      trap: false_fact
      why: It floats because it’s less dense than the fluid, so part of it stays above the surface.
  tldr: A floating object is submerged by ρ_object/ρ_fluid = 60%.
  steps:
    - label: Balance
      body: 'Floating: buoyant force = weight, so ρ_fluid·V_sub·g = ρ_obj·V·g.'
    - label: Solve
      body: V_sub/V = 600/1000 = 60%.
  takeaway: Submerged fraction of a floating object = its density ÷ the fluid’s density.
  siblings:
    - mcat-cp-5070
    - mcat-cp-5071
    - mcat-cp-5072
