    them is doubled. What is the new force?
  options:
    - text: F/2
      correct: true
      why: 'F ∝ q₁q₂/r²: the charges contribute ×2 and the distance ×1/4, giving F/2.'
    - text: F
      trap: skipped_step
      why: That forgets to square the distance factor.
    - text: 8F
      trap: wrong_direction
      why: 'Force falls as distance grows: divide by r², don’t multiply.'
    - text: F/4
      trap: skipped_step
      why: 'Recheck: multiply the charge factors, then divide by the distance factor squared.'
  tldr: F ∝ q₁q₂/r², so the force becomes F/2.
  steps:
    - label: Law
      body: F = kq₁q₂/r².
    - label: Scale
      body: Charge factor 2; distance factor 2 squared is 4; 2/4 → F/2.
  takeaway: Electric force is proportional to each charge and inversely proportional to distance squared.
