- id: mcat-cp-5001
  model: cp-acids_bases
  type: acids_bases
  kps:
    - kp-mcat-henderson-hasselbalch
  outline:
    category: 5A
    sirs: 2
  difficulty: 2
  prompt: >-
    A buffer is made from acetic acid (pKa = 4.76) and sodium acetate. If the acetate concentration is ten
    times the acetic acid concentration, what is the pH?
  options:
    - text: '5.76'
      correct: true
      why: pH = 4.76 + log(10) = 5.76.
    - text: '3.76'
      trap: sign_flip
      why: That uses log([HA]/[A⁻]), which flips the sign of the log term.
    - text: '4.76'
      trap: lookalike
      why: pH equals pKa only when the base and acid concentrations are equal.
    - text: '6.76'
      trap: power_of_ten
      why: log(10) is 1, so the pH moves 1 unit from the pKa.
  tldr: pH = pKa + log([A⁻]/[HA]) = 4.76 + 1 = 5.76.
  steps:
    - label: Recall
      body: 'Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA]).'
    - label: Compute
      body: '[A⁻]/[HA] = 10, and log(10) = 1, so pH = 5.76.'
    - label: Check
      body: More base than acid puts the pH above the pKa.
  takeaway: Each tenfold change in the base-to-acid ratio moves a buffer’s pH by one unit.
  siblings:
    - mcat-cp-5002
    - mcat-cp-5003
    - mcat-cp-5004
    - mcat-cp-5005
