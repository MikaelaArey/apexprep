  outline:
    category: 4E
    sirs: 1
  difficulty: 1
  prompt: How many moles are in 36 g of water (H₂O, molar mass 18 g/mol)?
  options:
    - text: 2 mol
      correct: true
      why: 36 g ÷ 18 g/mol = 2 mol.
    - text: 0.5 mol
      trap: wrong_direction
      why: That divides molar mass by mass. Moles = mass ÷ molar mass.
    - text: 648 mol
      trap: lookalike
      why: Multiplying mass by molar mass gives g²/mol, not moles.
    - text: 4 mol
      trap: skipped_step
      why: That doubles the answer. Recheck the division.
  tldr: n = m/M = 36/18 = 2 mol.
  steps:
    - label: Formula
      body: n = mass ÷ molar mass.
    - label: Compute
      body: 36 ÷ 18 = 2 mol.
  takeaway: 'Grams to moles: divide by molar mass.'
  siblings:
    - mcat-cp-5113
    - mcat-cp-5114
    - mcat-cp-5115
    - mcat-cp-5116
