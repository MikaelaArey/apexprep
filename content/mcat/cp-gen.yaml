    current does the battery supply?
  options:
    - text: 6 A
      correct: true
      why: R = 4 Ω, so I = 24 V ÷ 4 Ω = 6 A.
    - text: 1.33 A
      trap: lookalike
      why: That treats the resistors as if they were in series.
    - text: 2 A
      trap: skipped_step
      why: That uses only the 12 Ω resistor.
    - text: 4 A
      trap: skipped_step
      why: That uses only the 6 Ω resistor.
  tldr: 'Parallel: R = 4 Ω, so I = 24/4 = 6 A.'
  steps:
    - label: Combine
      body: R = (12 × 6)/(12 + 6) = 4 Ω.
    - label: Ohm’s law
      body: I = V/R = 24/4 = 6 A.
  takeaway: Parallel branches each get the full voltage, and their currents add.
