  prompt: A radioactive isotope has a half-life of 6 hours. What percentage of a sample remains after 24 hours?
  options:
    - text: 6.25%
      correct: true
      why: 24/6 = 4 half-lives, so (½)^4 = 0.0625 remains.
    - text: 93.75%
      trap: wrong_direction
      why: That’s the amount that has decayed, not what remains.
    - text: 12.5%
      trap: lookalike
      why: 'Decay is exponential: halve once per half-life rather than dividing by 2n.'
    - text: 3.13%
      trap: skipped_step
      why: 'That’s one half-life too many: 24/6 = 4.'
  tldr: 4 half-lives → (½)^4 = 0.0625 of the original.
  steps:
    - label: Count
      body: 24 ÷ 6 = 4 half-lives.
    - label: Compute
      body: (½)^4 = 0.0625 = 6.25%.
  takeaway: 'Each half-life halves what’s left: 1 → ½ → ¼ → ⅛ → 1/16.'
  siblings:
    - mcat-cp-5095
    - mcat-cp-5096
    - mcat-cp-5097
