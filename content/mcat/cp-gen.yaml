  model: cp-waves_sound
  type: waves_sound
  kps:
    - kp-mcat-oscillation
  outline:
    sirs: 2
  difficulty: 2
  prompt: >-
    A simple pendulum oscillates with period T. If its length is made four times longer, what is the new
    period?
  options:
    - text: 2×
      correct: true
      why: T ∝ √L, and √4 = 2.
    - text: 4×
      trap: skipped_step
      why: 'Take the square root: T ∝ √L.'
    - text: 0.5×
      trap: wrong_direction
      why: A longer pendulum swings more slowly, so T grows.
    - text: 1× (unchanged)
      trap: false_fact
      why: Length does set a pendulum’s period.
  tldr: 'Pendulum: T = 2π√(L/g), independent of mass.'
  steps:
    - label: Formula
      body: T = 2π√(L/g).
    - label: Scale
      body: T ∝ √L, and √4 = 2.
  takeaway: Pendulum period depends only on length (and g); a spring’s depends on m/k.
  siblings:
    - mcat-cp-5118
    - mcat-cp-5119
    - mcat-cp-5120
    - mcat-cp-5121
