  prompt: An object is placed 60 cm from a converging lens with a focal length of 20 cm. Where does the image form?
  options:
    - text: 30 cm on the opposite side (real)
      correct: true
      why: '1/dᵢ = 1/20 − 1/60, so dᵢ = 30 cm (positive: real, inverted).'
    - text: 30 cm on the object’s side (virtual)
      trap: sign_flip
      why: A positive dᵢ means a real image on the far side of the lens.
    - text: 15 cm on the opposite side (real)
      trap: sign_flip
      why: That adds 1/dₒ to 1/f instead of subtracting it.
    - text: 40 cm on the opposite side (real)
      trap: lookalike
      why: dₒ − f isn’t the lens equation. Use 1/f = 1/dₒ + 1/dᵢ.
  tldr: 1/dᵢ = 1/f − 1/dₒ = 1/20 − 1/60 → dᵢ = 30 cm (real).
  steps:
    - label: Equation
      body: 1/f = 1/dₒ + 1/dᵢ.
    - label: Solve
      body: 1/dᵢ = 1/20 − 1/60 → dᵢ = 30 cm.
    - label: Interpret
      body: 'Object outside f: real, inverted image on the far side.'
  takeaway: For a converging lens, objects beyond f give real images; objects inside f give virtual ones.
  siblings:
    - mcat-cp-5078
    - mcat-cp-5079
    - mcat-cp-5080
    - mcat-cp-5081
