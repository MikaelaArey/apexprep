# GENERATED by scripts/generate-items.mjs — edit the item models, not this file.
# Concept cards for the item-model questions.

- id: kp-mcat-strong-acid-ph
  section: CP
  title: Strong acid and base pH
  front: What is the pH of 0.001 M HCl? Of 0.001 M NaOH?
  back: >-
    Strong acids dissociate fully, so pH = −log[H⁺] = 3. For strong bases, pOH = −log[OH⁻] = 3 and pH = 14 − 3
    = 11 (at 25 °C).
- id: kp-mcat-dilution
  section: CP
  title: Dilution
  front: How do you find a concentration after dilution?
  back: M₁V₁ = M₂V₂, where V₂ is the final total volume. Dilution always lowers concentration.
- id: kp-mcat-molar-volume
  section: CP
  title: Molar volume at STP
  front: What volume does one mole of ideal gas occupy at STP (0 °C, 1 atm)?
  back: 22.4 L. Moles = volume ÷ 22.4 L/mol at STP.
- id: kp-mcat-combined-gas
  section: CP
  title: Combined gas law
  front: How does an ideal gas’s volume respond to pressure and temperature?
  back: 'PV/T is constant, so V ∝ T/P: volume rises with kelvin temperature and falls with pressure.'
- id: kp-mcat-electric-power
  section: CP
  title: Electric power
  front: What power does a resistor dissipate?
  back: P = IV = I²R = V²/R. At fixed resistance, doubling the voltage quadruples the power.
- id: kp-mcat-capacitors
  section: CP
  title: Capacitors
  front: How much charge and energy does a charged capacitor store?
  back: Q = CV and U = ½CV² (= ½QV).
- id: kp-mcat-coulomb
  section: CP
  title: Coulomb’s law
  front: How does the electric force between two charges scale?
  back: 'F = kq₁q₂/r²: proportional to each charge, inversely proportional to the square of the distance.'
- id: kp-mcat-projectile
  section: CP
  title: Horizontal launches
  front: A ball rolls off a ledge horizontally. What sets its flight time?
  back: 'Only the height: t = √(2h/g). Horizontal distance = horizontal speed × t.'
- id: kp-mcat-kinetic-energy
  section: CP
  title: Kinetic energy
  front: How does kinetic energy scale with speed and mass, and how fast is an object after falling h?
  back: KE = ½mv², so it scales with v². Energy conservation gives v = √(2gh), independent of mass.
- id: kp-mcat-work-power
  section: CP
  title: Work and power
  front: How do you find the average power of a force?
  back: 'Work W = Fd (force along the motion; lifting: mgh). Power P = W/t.'
- id: kp-mcat-hydrostatic
  section: CP
  title: Pressure at depth
  front: What is the pressure at a depth h in a fluid?
  back: Gauge pressure = ρgh. Absolute pressure adds the surface pressure (about 1 atm ≈ 100 kPa).
- id: kp-mcat-buoyancy
  section: CP
  title: Floating objects
  front: What fraction of a floating object is submerged?
  back: Its density divided by the fluid’s density (ρ_object/ρ_fluid).
- id: kp-mcat-magnification
  section: CP
  title: Magnification
  front: How do you read magnification for a lens or mirror?
  back: m = −dᵢ/dₒ. Negative means inverted, |m| < 1 means smaller than the object.
- id: kp-mcat-lens-power
  section: CP
  title: Lens power
  front: What is a lens’s power in diopters?
  back: P = 1/f with f in meters. Converging lenses are positive, diverging lenses negative.
- id: kp-mcat-decibels
  section: CP
  title: Sound level
  front: How do decibels relate to intensity?
  back: 'β = 10 log(I/I₀): every 10× in intensity adds 10 dB.'
- id: kp-mcat-half-life
  section: CP
  title: Half-life
  front: How much of a radioactive sample remains after n half-lives?
  back: (½)ⁿ of the original. Three half-lives leave one-eighth.
- id: kp-mcat-cell-potential
  section: CP
  title: Standard cell potential
  front: How do you get E°cell from standard reduction potentials?
  back: >-
    E°cell = E°(cathode) − E°(anode), both as reduction potentials. Never multiply by stoichiometric
    coefficients.
- id: kp-mcat-rate-law
  section: CP
  title: Rate laws
  front: Rate = k[A]²[B]. What happens if [A] doubles?
  back: The rate changes by 2² = 4×. Each concentration factor is raised to its order.
- id: kp-mcat-moles
  section: CP
  title: Moles from mass
  front: How do you convert grams to moles?
  back: Moles = mass ÷ molar mass (g/mol).
- id: kp-mcat-oscillation
  section: CP
  title: Periods of oscillation
  front: How do a pendulum’s and a spring’s periods depend on their properties?
  back: 'Pendulum: T = 2π√(L/g), independent of mass. Spring: T = 2π√(m/k).'
- id: kp-mcat-mendelian-ratios
  section: BB
  title: Mendelian ratios
  front: 'Aa × Aa: what fraction of offspring are aa? What fraction of the dominant-looking offspring are carriers?'
  back: ¼ are aa. Among dominant-phenotype offspring (AA, Aa, Aa), ⅔ are carriers.
- id: kp-mcat-x-linked
  section: BB
  title: X-linked inheritance
  front: >-
    A carrier mother and an unaffected father have a son. What’s the chance he’s affected by an X-linked
    recessive trait?
  back: ½. Sons get their only X from their mother; daughters of an unaffected father aren’t affected.
- id: kp-mcat-michaelis-menten
  section: BB
  title: Michaelis–Menten
  front: What is V₀ when [S] = Km? When [S] = 3Km?
  back: 'V₀ = Vmax[S]/(Km + [S]): ½Vmax at [S] = Km, ¾Vmax at 3Km, 9/10 Vmax at 9Km.'
- id: kp-mcat-lineweaver-burk
  section: BB
  title: Lineweaver–Burk plots
  front: What do the intercepts of a Lineweaver–Burk plot give?
  back: y-intercept = 1/Vmax; x-intercept = −1/Km; slope = Km/Vmax.
- id: kp-mcat-isoelectric-point
  section: BB
  title: Isoelectric point
  front: How do you find an amino acid’s pI?
  back: >-
    Average the two pKa values on either side of the neutral form: the two lowest for acidic side chains, the
    two highest for basic ones.
- id: kp-mcat-nernst
  section: BB
  title: Nernst equation
  front: How do you estimate an ion’s equilibrium potential at body temperature?
  back: E = (61.5 mV / z) × log([out]/[in]). K⁺ is about −90 mV; Na⁺ about +60 mV.
- id: kp-mcat-cardiac-output
  section: BB
  title: Cardiac output
  front: How are cardiac output, stroke volume and ejection fraction calculated?
  back: SV = EDV − ESV; CO = HR × SV; EF = SV/EDV.
- id: kp-mcat-ventilation
  section: BB
  title: Ventilation
  front: What’s the difference between minute and alveolar ventilation?
  back: 'Minute ventilation = tidal volume × rate. Alveolar ventilation subtracts dead space: (VT − VD) × rate.'
- id: kp-mcat-chargaff
  section: BB
  title: Chargaff’s rules
  front: In double-stranded DNA that is 20% adenine, what fraction is guanine?
  back: A = T and G = C, so A + T = 40% and G = C = 30% each.
- id: kp-mcat-normal-distribution
  section: PS
  title: The 68–95–99.7 rule
  front: In a normal distribution, what share of scores falls within 1, 2 and 3 standard deviations of the mean?
  back: About 68%, 95% and 99.7%. So about 16% lie above +1 SD and 2.5% above +2 SD.
- id: kp-mcat-z-scores
  section: PS
  title: z-scores
  front: How do you convert a raw score to a z-score?
  back: z = (score − mean)/SD. A z of +2 sits near the 97.5th percentile.
- id: kp-mcat-central-tendency
  section: PS
  title: Mean, median and skew
  front: In a right-skewed distribution, how do the mean and median compare?
  back: >-
    The long right tail pulls the mean above the median (and the median above the mode). The median resists
    outliers.
- id: kp-mcat-correlation-strength
  section: PS
  title: Reading correlations
  front: 'Which is the stronger correlation: r = −0.8 or r = +0.5? How much variance does r = 0.5 explain?'
  back: 'Strength is |r|, so −0.8 is stronger. r² is the variance explained: 0.5² = 25%.'
- id: kp-mcat-probability
  section: PS
  title: Probability of independent events
  front: How do you combine probabilities of independent events?
  back: 'Both happen: multiply. At least one happens: 1 − P(neither).'
- id: kp-mcat-weber
  section: PS
  title: Weber’s law
  front: If the just-noticeable difference for 100 g is 2 g, what is it for 400 g?
  back: 8 g. The JND is a constant fraction (here 2%) of the original stimulus.
- id: kp-mcat-demographic-rates
  section: PS
  title: Demographic rates
  front: How are crude birth rates and doubling times calculated?
  back: Crude rate = events per 1,000 people per year. Doubling time ≈ 70 ÷ annual growth rate (%).
