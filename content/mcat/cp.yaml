# MCAT Chemical and Physical Foundations: original practice questions for ApexPrep.
# Not official AAMC content. Every item needs expert review before status: live.

- id: mcat-cp-0001
  type: acids_bases
  family: gen_chem
  kps: [kp-mcat-henderson-hasselbalch]
  outline: { category: 5A, sirs: 2 }
  difficulty: 2
  prompt: >-
    A buffer is prepared from acetic acid (pKa = 4.76) and sodium acetate. If the
    acetate concentration is ten times the acetic acid concentration, what is the
    pH of the buffer?
  options:
    - text: "3.76"
      trap: sign_flip
      why: Using log([HA]/[A⁻]) flips the sign and gives 4.76 − 1.
    - text: "4.76"
      trap: lookalike
      why: pH equals pKa only when [A⁻] = [HA]. Here the ratio is 10.
    - text: "5.76"
      correct: true
      why: pH = 4.76 + log(10) = 4.76 + 1 = 5.76.
    - text: "6.76"
      trap: power_of_ten
      why: log 10 is 1, not 2.
  tldr: pH = pKa + log([A⁻]/[HA]) = 4.76 + log 10 = 5.76.
  steps:
    - label: Recall
      body: "Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA])."
    - label: Compute
      body: "[A⁻]/[HA] = 10 and log 10 = 1, so pH = 4.76 + 1 = 5.76."
    - label: Check
      body: More base than acid should push the pH above the pKa. It does.
  takeaway: >-
    Each tenfold increase in [A⁻]/[HA] raises a buffer's pH by exactly one unit
    above its pKa.
  siblings: []

- id: mcat-cp-0002
  type: circuits
  family: physics
  kps: [kp-mcat-parallel-resistors]
  outline: { category: 4C, sirs: 2 }
  difficulty: 2
  prompt: >-
    A 6 Ω resistor and a 3 Ω resistor are connected in parallel across an ideal
    12 V battery. What total current does the battery supply?
  options:
    - text: 1.3 A
      trap: lookalike
      why: That treats the resistors as if they were in series (12 V ÷ 9 Ω).
    - text: 2.0 A
      trap: skipped_step
      why: That's only the current through the 6 Ω branch.
    - text: 4.0 A
      trap: skipped_step
      why: That's only the current through the 3 Ω branch.
    - text: 6.0 A
      correct: true
      why: R = (6 × 3)/(6 + 3) = 2 Ω, so I = 12 V ÷ 2 Ω = 6 A.
  tldr: In parallel, R = 6·3/(6+3) = 2 Ω, so I = 12/2 = 6 A.
  steps:
    - label: Recall
      body: "Two resistors in parallel: R = R₁R₂/(R₁ + R₂)."
    - label: Compute
      body: R = 18/9 = 2 Ω, and I = V/R = 12/2 = 6 A.
    - label: Check
      body: >-
        Branch currents are 12/6 = 2 A and 12/3 = 4 A. They add to 6 A, which
        matches.
  takeaway: >-
    Parallel resistance is smaller than the smallest branch. Each branch sees the
    full voltage and the currents add.
  siblings: []

- id: mcat-cp-0003
  type: thermodynamics
  family: gen_chem
  kps: [kp-mcat-gibbs-temperature]
  outline: { category: 5E, sirs: 2 }
  difficulty: 3
  prompt: >-
    A reaction has ΔH = +40 kJ/mol and ΔS = +100 J/(mol·K). Assuming both values
    are independent of temperature, under what conditions is the reaction
    spontaneous?
  options:
    - text: At all temperatures
      trap: lookalike
      why: That's the case for ΔH < 0 and ΔS > 0. A positive ΔH needs a high T.
    - text: Only below 400 K
      trap: sign_flip
      why: Below 400 K, ΔH outweighs TΔS and ΔG is positive.
    - text: Only above 400 K
      correct: true
      why: ΔG < 0 when T > ΔH/ΔS = 40,000 J ÷ 100 J/K = 400 K.
    - text: Only above 0.4 K
      trap: power_of_ten
      why: That comes from dividing kJ by J without converting units.
  tldr: ΔG = ΔH − TΔS < 0 when T > 40,000 ÷ 100 = 400 K.
  steps:
    - label: Recall
      body: ΔG = ΔH − TΔS. Spontaneous means ΔG < 0.
    - label: Units
      body: ΔH = +40 kJ/mol = +40,000 J/mol.
    - label: Compute
      body: TΔS must exceed ΔH, so T > 40,000 ÷ 100 = 400 K.
  takeaway: >-
    With ΔH > 0 and ΔS > 0, a reaction is spontaneous only above T = ΔH/ΔS, after
    matching the units.
  siblings: []

- id: mcat-cp-0004
  type: fluids
  family: physics
  kps: [kp-mcat-continuity]
  outline: { category: 4B, sirs: 2 }
  difficulty: 2
  prompt: >-
    Water flows steadily through a horizontal pipe that narrows from a
    cross-sectional area of 4.0 cm² to 1.0 cm². If the water moves at 2.0 m/s in
    the wide section, how fast does it move in the narrow section?
  options:
    - text: 0.5 m/s
      trap: wrong_direction
      why: That inverts the ratio. Water speeds up in the narrow section.
    - text: 2.0 m/s
      trap: lookalike
      why: The volume flow rate stays constant, not the speed.
    - text: 4.0 m/s
      trap: lookalike
      why: >-
        That scales by the ratio of the pipe's widths (2×) instead of its areas
        (4×).
    - text: 8.0 m/s
      correct: true
      why: A₁v₁ = A₂v₂, so v₂ = (4.0 × 2.0)/1.0 = 8.0 m/s.
  tldr: Area drops 4×, so speed rises 4×, from 2 m/s to 8 m/s.
  steps:
    - label: Recall
      body: "Continuity for an incompressible fluid: A₁v₁ = A₂v₂."
    - label: Compute
      body: v₂ = A₁v₁/A₂ = (4.0 × 2.0)/1.0 = 8.0 m/s.
    - label: Check
      body: A narrower pipe must carry the same volume per second, so the water speeds up.
  takeaway: >-
    Fluid speed scales inversely with cross-sectional area. Halve the radius and
    the speed quadruples.
  siblings: []

- id: mcat-cp-0005
  type: gases
  family: gen_chem
  kps: [kp-mcat-gas-kelvin]
  outline: { category: 4B, sirs: 2 }
  difficulty: 1
  prompt: >-
    A sealed, rigid container of an ideal gas is heated from 27 °C to 327 °C. What
    happens to the pressure of the gas?
  options:
    - text: It increases by a factor of about 12.
      trap: power_of_ten
      why: That uses Celsius (327 ÷ 27). Gas laws need kelvin.
    - text: It doubles.
      correct: true
      why: 300 K → 600 K, and at constant volume P ∝ T.
    - text: It stays the same.
      trap: lookalike
      why: A rigid container keeps the volume constant, not the pressure.
    - text: It is cut in half.
      trap: wrong_direction
      why: Heating a gas at constant volume raises its pressure.
  tldr: 27 °C = 300 K and 327 °C = 600 K, so pressure doubles at constant volume.
  steps:
    - label: Convert
      body: 27 + 273 = 300 K and 327 + 273 = 600 K.
    - label: Apply
      body: "Rigid container means constant V, so P₁/T₁ = P₂/T₂."
    - label: Compute
      body: T doubles, so P doubles.
  takeaway: Always convert to kelvin before using a gas law.
  siblings: []

- id: mcat-cp-0006
  type: electrochemistry
  family: gen_chem
  kps: [kp-mcat-galvanic]
  outline: { category: 4C, sirs: 1 }
  difficulty: 2
  prompt: >-
    In a galvanic cell, at which electrode does oxidation occur, and in which
    direction do electrons flow through the external wire?
  options:
    - text: At the anode; electrons flow from the anode to the cathode.
      correct: true
      why: Oxidation releases electrons at the anode, and they travel through the wire to the cathode.
    - text: At the cathode; electrons flow from the cathode to the anode.
      trap: lookalike
      why: Reduction, not oxidation, happens at the cathode.
    - text: At the anode; electrons flow from the cathode to the anode.
      trap: sign_flip
      why: Right electrode, wrong direction. Electrons leave the anode.
    - text: At the cathode; electrons flow from the anode to the cathode.
      trap: lookalike
      why: Right direction, wrong electrode for oxidation.
  tldr: Oxidation at the anode releases electrons, which flow through the wire to the cathode.
  steps:
    - label: Recall
      body: '"An Ox, Red Cat": anode oxidation, cathode reduction.'
    - label: Flow
      body: Electrons are produced at the anode and consumed at the cathode, so they move anode → cathode.
  takeaway: In every electrochemical cell, oxidation is at the anode and electrons flow out of it.
  siblings: []

- id: mcat-cp-0007
  type: kinetics_equilibrium
  family: gen_chem
  kps: [kp-mcat-le-chatelier]
  outline: { category: 5E, sirs: 2 }
  difficulty: 2
  prompt: >-
    For the exothermic reaction N₂(g) + 3H₂(g) ⇌ 2NH₃(g) at equilibrium, which
    change shifts the equilibrium toward NH₃?
  options:
    - text: Raising the temperature
      trap: wrong_direction
      why: For an exothermic reaction, heat acts like a product, so adding it shifts toward reactants.
    - text: Increasing the pressure by decreasing the container volume
      correct: true
      why: The product side has 2 moles of gas versus 4, so higher pressure favors NH₃.
    - text: Adding a catalyst
      trap: lookalike
      why: A catalyst speeds both directions equally; equilibrium doesn't move.
    - text: Removing some H₂
      trap: wrong_direction
      why: Removing a reactant shifts the equilibrium toward reactants.
  tldr: Higher pressure favors the side with fewer gas moles, which is NH₃ (2 vs. 4).
  steps:
    - label: Count
      body: Reactants have 1 + 3 = 4 gas moles; products have 2.
    - label: Apply
      body: Compressing the system shifts it toward fewer moles, which is toward NH₃.
    - label: Check
      body: Heat would push it back (exothermic), and catalysts don't shift it at all.
  takeaway: >-
    Pressure changes favor the side with fewer gas moles. Catalysts change the
    rate, never the position of equilibrium.
  siblings: []

- id: mcat-cp-0008
  type: optics
  family: physics
  kps: [kp-mcat-thin-lens]
  outline: { category: 4D, sirs: 2 }
  difficulty: 3
  prompt: >-
    An object is placed 30 cm in front of a converging lens with a focal length of
    10 cm. Where does the image form?
  options:
    - text: 7.5 cm from the lens
      trap: sign_flip
      why: That adds 1/30 to 1/10 instead of subtracting it.
    - text: 15 cm on the opposite side of the lens (a real image)
      correct: true
      why: 1/dᵢ = 1/10 − 1/30 = 2/30, so dᵢ = 15 cm, positive and therefore real.
    - text: 15 cm on the same side as the object (a virtual image)
      trap: lookalike
      why: The distance is right, but a positive dᵢ means a real image on the far side.
    - text: 20 cm from the lens
      trap: lookalike
      why: That subtracts the focal length from the object distance, which isn't the lens equation.
  tldr: 1/dᵢ = 1/10 − 1/30 = 1/15, so a real image forms 15 cm behind the lens.
  steps:
    - label: Recall
      body: 1/f = 1/dₒ + 1/dᵢ.
    - label: Compute
      body: 1/dᵢ = 1/10 − 1/30 = 3/30 − 1/30 = 2/30, so dᵢ = 15 cm.
    - label: Interpret
      body: Positive dᵢ means a real, inverted image on the opposite side.
  takeaway: >-
    Outside the focal length, a converging lens makes a real, inverted image. Inside
    it, the image is virtual and upright.
  siblings: []

- id: mcat-cp-0009
  type: kinematics
  family: physics
  kps: [kp-mcat-free-fall]
  outline: { category: 4A, sirs: 2 }
  difficulty: 1
  prompt: >-
    A ball is dropped from rest from a height of 20 m. Ignoring air resistance and
    using g ≈ 10 m/s², how long does it take to reach the ground?
  options:
    - text: About 1.4 s
      trap: lookalike
      why: That uses h = gt² and drops the ½.
    - text: 2 s
      correct: true
      why: 20 = ½(10)t², so t² = 4 and t = 2 s.
    - text: 4 s
      trap: skipped_step
      why: That's t², not t. Take the square root.
    - text: It depends on the ball's mass.
      trap: false_fact
      why: Without air resistance, every object falls with the same acceleration.
  tldr: h = ½gt² → 20 = 5t² → t = 2 s.
  steps:
    - label: Recall
      body: For a drop from rest, h = ½gt².
    - label: Compute
      body: 20 = ½ × 10 × t² = 5t², so t² = 4 and t = 2 s.
  takeaway: For a drop from rest, t = √(2h/g), independent of mass.
  siblings: []
