  prompt: A sample of double-stranded DNA is 20% adenine. What percentage is guanine?
  options:
    - text: 30%
      correct: true
      why: Adenine pairs with thymine (20% each), leaving 60% split evenly between the other two bases.
    - text: 20%
      trap: lookalike
      why: Guanine isn’t adenine’s partner, so it doesn’t equal 20%.
    - text: 80%
      trap: skipped_step
      why: Subtract both adenine and its partner thymine before splitting.
    - text: 60%
      trap: skipped_step
      why: That’s the two remaining bases together. Split it in half.
  tldr: 'A = T and G = C: 20% adenine means 20% thymine, and 30% each of the others.'
  steps:
    - label: Pair
      body: Adenine = thymine = 20%.
    - label: Split
      body: 'The remaining 60% is shared equally: 30% each.'
  takeaway: In double-stranded DNA, A = T and G = C, so the four percentages come in matching pairs.
  siblings:
    - mcat-bb-5045
    - mcat-bb-5046
    - mcat-bb-5047
