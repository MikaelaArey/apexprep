- id: mcat-bb-5018
  model: bb-enzyme_kinetics
  type: enzyme_kinetics
  kps:
    - kp-mcat-michaelis-menten
  outline:
    category: 1A
    sirs: 2
  difficulty: 2
  prompt: An enzyme has Vmax = 100 µM/min and Km = 2 mM. What is the initial velocity when [S] = 4 mM?
  options:
    - text: 66.7 µM/min
      correct: true
      why: V₀ = Vmax[S]/(Km + [S]) = 100 × 4/(2 + 4) = 66.7 µM/min.
    - text: 50 µM/min
      trap: lookalike
      why: Vmax/2 applies only when [S] = Km.
    - text: 33.3 µM/min
      trap: wrong_direction
      why: That puts Km in the numerator. V₀ = Vmax[S]/(Km + [S]).
    - text: 16.7 µM/min
      trap: skipped_step
      why: That leaves [S] out of the numerator.
  tldr: V₀ = 100 × 4/(2 + 4) = 66.7 µM/min.
  steps:
    - label: Equation
      body: V₀ = Vmax[S]/(Km + [S]).
