    - kp-mcat-hardy-weinberg
  outline:
    category: 1C
    sirs: 2
  difficulty: 2
  prompt: >-
    In a population in Hardy–Weinberg equilibrium, 4% of individuals show a recessive phenotype. What
    percentage of the population is heterozygous?
  options:
    - text: 32%
      correct: true
      why: q = √0.04 = 0.2, p = 0.8; 2pq = 0.32.
    - text: 4%
      trap: lookalike
      why: That’s q², the recessive phenotype frequency itself.
    - text: 16%
      trap: skipped_step
      why: Heterozygotes are 2pq, not pq.
    - text: 64%
      trap: lookalike
      why: That’s p², the homozygous dominant frequency.
  tldr: q² = 0.04 → q = 0.2, p = 0.8; 2pq = 32%.
  steps:
    - label: Find q
      body: The recessive phenotype is q² = 0.04, so q = 0.2.
    - label: Find p
      body: p = 1 − q = 0.8.
    - label: Answer
      body: 2pq = 2 × 0.8 × 0.2 = 0.32.
  takeaway: Start Hardy–Weinberg problems from q² (the recessive phenotype); take its square root to get q.
  siblings:
    - mcat-bb-5002
    - mcat-bb-5003
    - mcat-bb-5004
    - mcat-bb-5005
