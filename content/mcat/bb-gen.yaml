  prompt: >-
    A person breathes 12 times per minute with a tidal volume of 500 mL; anatomical dead space is 150 mL. What
    is their minute ventilation?
  options:
    - text: 6 L/min
      correct: true
      why: 500 mL × 12/min = 6 L/min.
    - text: 4.2 L/min
      trap: lookalike
      why: That subtracts dead space, which gives alveolar ventilation.
    - text: 60 L/min
      trap: power_of_ten
      why: 'Convert mL to L: divide by 1000.'
    - text: 7.8 L/min
      trap: misread_data
      why: Tidal volume already includes the dead space; don’t add it.
  tldr: VE = VT × RR = 6 L/min.
  steps:
    - label: Formula
      body: Minute ventilation = tidal volume × rate.
    - label: Compute
      body: 6000 mL/min = 6 L/min.
  takeaway: Dead space air never reaches the alveoli, so fast, shallow breathing wastes a bigger share of each breath.
  siblings:
    - mcat-bb-5041
    - mcat-bb-5042
    - mcat-bb-5043
