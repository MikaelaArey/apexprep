  difficulty: 2
  prompt: On a Lineweaver–Burk plot for an enzyme, the line crosses the y-axis at 0.025 min/µM. What is Vmax?
  options:
    - text: 40 µM/min
      correct: true
      why: y-intercept = 1/Vmax, so Vmax = 1/0.025 = 40 µM/min.
    - text: 0.025 µM/min
      trap: skipped_step
      why: That’s the intercept itself. Take its reciprocal.
    - text: −40 µM/min
      trap: sign_flip
      why: Vmax is positive.
    - text: 20 µM/min
      trap: lookalike
      why: Half of Vmax is the rate at [S] = Km, not Vmax.
  tldr: Vmax = 1/(y-intercept) = 40 µM/min.
  steps:
    - label: Recall
      body: 1/V₀ = (Km/Vmax)(1/[S]) + 1/Vmax.
    - label: Intercept
      body: At 1/[S] = 0, 1/V₀ = 1/Vmax.
  takeaway: 'Lineweaver–Burk: y-intercept 1/Vmax, x-intercept −1/Km, slope Km/Vmax.'
  siblings:
    - mcat-bb-5024
    - mcat-bb-5025
    - mcat-bb-5026
