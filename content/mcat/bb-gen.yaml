  prompt: >-
    At 37 °C, K⁺ is 5 mM outside a cell and 150 mM inside. Using E = (61.5/z) log([out]/[in]) mV, what is the
    equilibrium potential for K⁺?
  options:
    - text: −91 mV
      correct: true
      why: (61.5/1) × log(0.0333) = −91 mV.
    - text: +91 mV
      trap: sign_flip
      why: That uses [in]/[out]. The Nernst equation puts [out] on top.
    - text: −45 mV
      trap: skipped_step
      why: Recheck the logarithm of the concentration ratio.
    - text: −182 mV
      trap: skipped_step
      why: Recheck the logarithm of the concentration ratio.
  tldr: E = (61.5/1) × log(5/150) ≈ −91 mV.
  steps:
    - label: Ratio
      body: '[out]/[in] = 0.0333; log = −1.477.'
    - label: Charge
      body: 'Multiply by 61.5/1: −91 mV.'
  takeaway: >-
    Ions concentrated outside with positive charge give positive potentials (Na⁺, Ca²⁺); K⁺, concentrated
    inside, gives a negative one.
  siblings:
