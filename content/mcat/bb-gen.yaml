  prompt: Glycine has pKa values of 2.34, 9.60. What is its isoelectric point (pI)?
  options:
    - text: '5.97'
      correct: true
      why: 'Average the two pKas around the neutral form: (2.34 + 9.60)/2 = 5.97.'
    - text: '6.97'
      trap: misread_data
      why: pI is the average of the two pKas.
    - text: '9.60'
      trap: lookalike
      why: A single pKa isn’t the pI; the pI sits between two of them.
    - text: '7.00'
      trap: false_fact
      why: pI depends on the side chain; it isn’t automatically neutral pH.
  tldr: pI = average of the two pKas bracketing the zwitterion = 5.97.
  steps:
    - label: Classify
      body: 'Two ionizable groups: average them.'
    - label: Compute
      body: (2.34 + 9.60)/2 = 5.97.
  takeaway: 'pI = mean of the two pKas around the net-neutral form: lowest pair for acidic, highest pair for basic.'
  siblings:
    - mcat-bb-5028
    - mcat-bb-5029
    - mcat-bb-5030
