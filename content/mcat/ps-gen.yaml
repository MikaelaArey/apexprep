- id: mcat-ps-5014
  model: ps-statistics
  type: statistics
  kps:
    - kp-mcat-central-tendency
  outline:
    sirs: 4
  difficulty: 2
  prompt: Household incomes in a city are strongly right-skewed. How do the mean and median income compare?
  options:
    - text: The mean is greater than the median.
      correct: true
      why: A few very high incomes stretch the right tail and pull the mean up.
    - text: The median is greater than the mean.
      trap: wrong_direction
      why: That pattern goes with left (negative) skew.
    - text: They are equal.
      trap: false_fact
      why: Mean and median match only in symmetric distributions.
    - text: It can’t be determined from the shape alone.
      trap: too_weak
      why: Skew direction tells you which way the mean is pulled.
  tldr: 'Right skew: mean > median > mode.'
  steps:
    - label: Shape
      body: Right-skewed means a long tail of high values.
    - label: Effect
      body: The mean is sensitive to those extremes; the median isn’t.
  takeaway: 'The mean follows the tail: right skew puts it above the median, left skew below.'
  siblings:
    - mcat-ps-5010
    - mcat-ps-5011
    - mcat-ps-5012
    - mcat-ps-5013
