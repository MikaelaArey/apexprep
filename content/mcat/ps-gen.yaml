  outline:
    category: 9B
    sirs: 2
  difficulty: 1
  prompt: A city of 1,000,000 people records 15,000 births in a year. What is its crude birth rate?
  options:
    - text: 15 per 1,000
      correct: true
      why: 15,000 ÷ 1,000,000 × 1,000 = 15.
    - text: 1.5 per 1,000
      trap: lookalike
      why: That’s a percentage. Crude rates are per 1,000 people.
    - text: 150 per 1,000
      trap: power_of_ten
      why: That’s per 10,000. Crude rates use 1,000.
    - text: 66.7 per 1,000
      trap: wrong_direction
      why: That inverts the ratio.
  tldr: Crude birth rate = births/population × 1,000 = 15.
  steps:
    - label: Ratio
      body: 15,000/1,000,000 = 0.015.
    - label: Scale
      body: × 1,000 = 15 per 1,000.
  takeaway: Crude birth and death rates are counted per 1,000 people per year.
  siblings:
    - mcat-ps-5028
    - mcat-ps-5029
    - mcat-ps-5030
    - mcat-ps-5031
