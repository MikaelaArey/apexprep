  outline:
    sirs: 4
  difficulty: 1
  prompt: A test has a mean of 100 and a standard deviation of 15. What is the z-score of a student who scored 130?
  options:
    - text: '2'
      correct: true
      why: z = (130 − 100)/15 = 2.
    - text: −2
      trap: sign_flip
      why: Subtract the mean from the score, not the reverse.
    - text: '30'
      trap: skipped_step
      why: That’s the raw difference. Divide by the standard deviation.
    - text: '0.133'
      trap: lookalike
      why: Divide by the standard deviation, not the variance.
  tldr: z = (score − mean)/SD = 2.
  steps:
    - label: Difference
      body: 130 − 100 = 30.
    - label: Standardize
      body: 30/15 = 2.
  takeaway: A z-score counts how many standard deviations a score sits from the mean.
  siblings:
    - mcat-ps-5007
    - mcat-ps-5008
    - mcat-ps-5009
