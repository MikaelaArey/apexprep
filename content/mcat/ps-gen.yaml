- id: mcat-ps-5019
  model: ps-statistics
  type: statistics
  kps:
    - kp-mcat-probability
  outline:
    sirs: 4
  difficulty: 2
  prompt: >-
    A couple’s chance of having a girl is ½ for each birth. What is the probability their first two children
    are both girls?
  options:
    - text: 1/4
      correct: true
      why: 'Independent events multiply: 0.5 × 0.5 = 0.25.'
    - text: 1/1
      trap: lookalike
      why: Adding probabilities applies to mutually exclusive events, not to “both.”
    - text: 3/4
      trap: lookalike
      why: That’s the chance of at least one.
    - text: 1/2
      trap: skipped_step
      why: That counts only one event.
  tldr: 'Multiply: 0.5 × 0.5 = 0.25.'
  steps:
    - label: Independence
      body: One outcome doesn’t change the other’s probability.
    - label: Combine
      body: P(A and B) = P(A) × P(B).
  takeaway: “Both” means multiply; “at least one” means 1 minus the chance of neither.
  siblings:
    - mcat-ps-5020
    - mcat-ps-5021
    - mcat-ps-5022
- id: mcat-ps-5020
  model: ps-statistics
  type: statistics
  kps:
    - kp-mcat-probability
  outline:
    sirs: 4
  difficulty: 2
  prompt: >-
    Each of two independent screening tests has a 10% false-positive rate. What is the probability that a
    healthy person gets at least one false positive?
  options:
    - text: 19%
      correct: true
      why: 1 − P(no false positives) = 1 − (0.9 × 0.9) = 0.19.
    - text: 20%
      trap: lookalike
      why: Adding probabilities applies to mutually exclusive events, not to “both.”
    - text: 1%
      trap: lookalike
      why: That’s the chance of both, not at least one.
    - text: 10%
      trap: skipped_step
      why: That counts only one event.
  tldr: At least one = 1 − (0.9)² = 0.19.
  steps:
    - label: Independence
      body: One outcome doesn’t change the other’s probability.
    - label: Combine
      body: P(at least one) = 1 − P(neither).
  takeaway: “Both” means multiply; “at least one” means 1 minus the chance of neither.
  siblings:
    - mcat-ps-5019
    - mcat-ps-5021
    - mcat-ps-5022
