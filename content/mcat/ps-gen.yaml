- id: mcat-ps-5017
  model: ps-statistics
  type: statistics
  kps:
    - kp-mcat-correlation-strength
  outline:
    sirs: 4
  difficulty: 2
  prompt: >-
    Two variables have a correlation of r = 0.5. What proportion of the variance in one is accounted for by
    the other?
  options:
    - text: 25%
      correct: true
      why: r² = (0.5)² = 0.25 = 25%.
    - text: 50%
      trap: skipped_step
      why: Variance explained is r², not r.
    - text: −25%
      trap: sign_flip
      why: r² can’t be negative.
    - text: 75%
      trap: wrong_direction
      why: That’s the variance left unexplained.
  tldr: Variance explained = r² = 25%.
  steps:
    - label: Square
      body: (0.5)² = 0.25.
    - label: Read
      body: 25% of the variance is shared.
  takeaway: Square r to get the variance explained; even r = 0.5 explains only 25%.
  siblings:
    - mcat-ps-5015
    - mcat-ps-5016
    - mcat-ps-5018
