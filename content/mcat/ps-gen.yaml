  difficulty: 2
  prompt: >-
    A person can just detect a change from 100 g to 102 g. By Weber’s law, what is the smallest detectable
    change from 400 g?
  options:
    - text: 8 g
      correct: true
      why: Weber fraction = 2/100 = 0.02; 0.02 × 400 = 8 g.
    - text: 2 g
      trap: lookalike
      why: The JND isn’t a fixed amount; it’s a fixed fraction of the stimulus.
    - text: 0.5 g
      trap: wrong_direction
      why: That inverts the scaling. Bigger stimuli need bigger changes.
    - text: 302 g
      trap: lookalike
      why: Weber’s law is proportional, not additive.
  tldr: 'JND = k × stimulus: 0.02 × 400 = 8 g.'
  steps:
    - label: Weber fraction
      body: k = ΔI/I = 2/100 = 0.02.
    - label: Scale
      body: 0.02 × 400 = 8.
  takeaway: The just-noticeable difference grows in proportion to the baseline stimulus.
  siblings:
    - mcat-ps-5024
    - mcat-ps-5025
