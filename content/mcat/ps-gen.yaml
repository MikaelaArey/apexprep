- id: mcat-ps-5029
  model: ps-demographics
  type: demographics
  kps:
    - kp-mcat-demographic-rates
  outline:
    category: 9B
    sirs: 2
  difficulty: 2
  prompt: A population grows at a steady 2% per year. About how long will it take to double?
  options:
    - text: 35 years
      correct: true
      why: 'Rule of 70: 70 ÷ 2 ≈ 35 years.'
    - text: 50 years
      trap: lookalike
      why: That ignores compounding (100 ÷ rate). Growth compounds, so doubling comes sooner.
    - text: 25 years
      trap: lookalike
      why: The rule of thumb uses 70 (≈ 100 × ln 2), not 50.
    - text: 140 years
      trap: wrong_direction
      why: Divide 70 by the rate; faster growth means a shorter doubling time.
  tldr: Doubling time ≈ 70 ÷ 2% ≈ 35 years.
  steps:
    - label: Rule of 70
      body: Doubling time (years) ≈ 70 ÷ annual growth rate in percent.
    - label: Compute
      body: 70 ÷ 2 ≈ 35.
  takeaway: 'Rule of 70: doubling time ≈ 70 ÷ percent growth per year.'
  siblings:
    - mcat-ps-5027
    - mcat-ps-5028
    - mcat-ps-5030
    - mcat-ps-5031
